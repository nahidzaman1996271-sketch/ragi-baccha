<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <title>For My Ragi Baccha, My Shundori Pakhi ❤️ — From Nahid</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],

              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',

            },
            cream: '#fffdf9',

            amberGlow: '#f59e0b'

  <!-- React 18, ReactDOM 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Canvas-Confetti for celebratory bursts -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ========================================================= */
    /* MOTION GRAPHICS & ROMANTIC ANIMATION STYLES              */
    /* ========================================================= */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(244, 63, 94, 0.55)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.9)); transform: scale(1.03); }
    }
    @keyframes gentleBreathing {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.015) translateY(-4px); }
    }
    @keyframes radiantRings {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }
    @keyframes shimmerRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes skyLanternDrift {
      0% { transform: translateY(0) translateX(0) scale(0.85); opacity: 0.95; }
      50% { transform: translateY(-160px) translateX(25px) scale(1.1); opacity: 0.9; }
      100% { transform: translateY(-380px) translateX(-35px) scale(0.6); opacity: 0; }
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }
    @keyframes softHeartGleam {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(251, 113, 133, 0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.85)); transform: scale(1.08); }
    }

    .animate-float-slow { animation: floatSlow 4.5s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .animate-breathe { animation: gentleBreathing 4s ease-in-out infinite; }
    .animate-radiant { animation: radiantRings 3s ease-in-out infinite; }
    .animate-spin-slow { animation: spinDisc 9s linear infinite; }
    .animate-heart-gleam { animation: softHeartGleam 2.8s ease-in-out infinite; }
    .animate-lantern { animation: skyLanternDrift 5s cubic-bezier(0.2, 0.8, 0.25, 1) forwards; }

    /* Shimmering gradient border animation */
    .shimmer-conic {
      background: conic-gradient(from 0deg, #f43f5e, #fbbf24, #ec4899, #f43f5e);
      animation: shimmerRotate 4s linear infinite;
    }

    /* Soundwave Equalizer Bars */
    .equalizer-bar:nth-child(1) { animation: waveBar 1.1s ease-in-out infinite 0.1s; }
    .equalizer-bar:nth-child(2) { animation: waveBar 0.9s ease-in-out infinite 0.25s; }
    .equalizer-bar:nth-child(3) { animation: waveBar 1.3s ease-in-out infinite 0.05s; }
    .equalizer-bar:nth-child(4) { animation: waveBar 0.8s ease-in-out infinite 0.35s; }
    .equalizer-bar:nth-child(5) { animation: waveBar 1.2s ease-in-out infinite 0.2s; }

    /* Vintage Paper Stationery Card */
    .paper-card {
      background-color: #fffbf5;
      background-image: 
        radial-gradient(at 15% 15%, rgba(254, 205, 211, 0.35) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(253, 230, 138, 0.25) 0px, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(244, 63, 94, 0.07) 31px, rgba(244, 63, 94, 0.07) 32px);
      box-shadow: 0 25px 60px rgba(136, 19, 55, 0.14), inset 0 0 45px rgba(251, 113, 133, 0.08);
    }

    /* Sticker Glow Effect */
    .sticker-shadow {
      filter: drop-shadow(0 14px 25px rgba(225, 29, 72, 0.22)) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
    }

    .sticker-sunset-shadow {
      filter: drop-shadow(0 18px 35px rgba(245, 158, 11, 0.35)) drop-shadow(0 8px 16px rgba(190, 24, 93, 0.25));
    }

    /* Vinyl Record Radial Grooves */
    .vinyl-grooves {
      background: repeating-radial-gradient(
        circle,
        #1c1917 0px,
        #1c1917 4px,
        #292524 5px,
        #1c1917 6px
      );
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #fff1f2; }
    ::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #f43f5e; }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-rose-50 text-rose-950 font-sans antialiased selection:bg-rose-200 selection:text-rose-900 overflow-x-hidden min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // 1. PLAYLIST CONFIGURATION — ALL SONGS INCLUDED (Surprise song hidden)
    // =========================================================================
    const PLAYLIST = [
      {
        id: 'surprise-song',
        title: 'A Special Song For You',
        subtitle: 'Nahid’s Surprise Pick For Pakhi 💖',
        src: 'khoka.mp3',
        badge: 'Surprise 💖',
        icon: '🎁',
        durationHint: 'Secret Choice'
      },
      {
        id: 'je-pakhi',
        title: 'Je Pakhi Ghor Bujhena',
        subtitle: 'For My Beautiful Pakhi 🕊️',
        src: 'je_pakhi_ghor_bujena.mp3',
        badge: 'Romantic',
        icon: '🕊️',
        durationHint: 'Acoustic Love'
      },
      {
        id: 'chiro-ovagi',
        title: 'Chiro Ovagi',
        subtitle: 'Deep Heartfelt Melodies 🥀',
        src: 'chiro_ovagi.mp3',
        badge: 'Emotional',
        icon: '🥀',
        durationHint: 'Soulful'
      },
      {
        id: 'forever',
        title: 'Forever',
        subtitle: 'Our Journey Together Always 💫',
        src: 'forever.mp3',
        badge: 'Forever',
        icon: '💫',
        durationHint: 'Timeless'
      }
    ];

    // Default Cherished Memories with Fixed Grammar & Genuine Banter
    const DEFAULT_MEMORIES = [
      {
        id: 'first-meeting',
        badge: 'Chapter 01',
        title: 'Our First Meeting in That Yellow Dress 💛',
        date: 'First semester, our very first class',
        description: 'The very first day I saw you in that bright yellow dress! My immediate thought was: "Who is this girl? She looks so dangerously cute, I should probably keep my distance!" …little did I know you would become my whole world.'
      },
      {
        id: 'favorite-memory',
        badge: 'Chapter 02',
        title: 'Our Favorite Dates & Sweet Walks 💖',
        date: 'End of 1st semester & anywhere we are together',
        description: 'Those quiet walks where nothing else mattered. Just listening to you talk, looking at your expressive eyes, and realizing that home is anywhere you are beside me.'
      },
      {
        id: 'funniest-moment',
        badge: 'Chapter 03',
        title: 'The Transport Incident ("Eta ki ucha hoye ache?") 😂',
        date: 'Inside the campus transport',
        description: 'I know you remember this hilarious moment! When you blurted out "Eta ki ucha hoye ache?" We burst into non-stop laughter and I was so embarrassingly red! One of our most unforgettable memories.'
      },
      {
        id: 'supported-each-other',
        badge: 'Chapter 04',
        title: 'Our Playful Teasing & Constant Support 🤝',
        date: 'Every single day of our lives',
        description: 'We banter, tease, and poke fun at each other every day, but deep down, we both know we are each other’s biggest shelter and truest best friend.'
      },
      {
        id: 'future-dream',
        badge: 'Chapter 05',
        title: 'I Want To Be With You Forever 💍',
        date: 'Our Forever Ahead',
        description: 'I never want to see tears in your eyes. I want to make you smile and laugh every single day. And remember this truth: I am the only one who will happily adore, cherish, and handle all your cute tantrums and angry moods forever!'
      }
    ];

    // =========================================================================
    // 2. ROMANTIC PARTICLE CANVAS ENGINE (Background Petals & Cursor Magic)
    // =========================================================================
    const RomanticParticleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Falling Petals & Glow Orbs
        const petals = Array.from({ length: 28 }).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 6 + Math.random() * 9,
          speedY: 0.6 + Math.random() * 1.2,
          speedX: (Math.random() - 0.5) * 0.9,
          angle: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - 0.5) * 0.03,
          color: Math.random() > 0.4 ? 'rgba(251, 113, 133, 0.45)' : 'rgba(244, 63, 94, 0.35)',
          type: Math.random() > 0.5 ? 'petal' : 'heart'
        }));

        // Interactive Sparkle Trail on pointer movement
        const sparkleTrails = [];
        const handlePointer = (e) => {
          const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
          const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : null);
          if (clientX == null || clientY == null) return;

          for (let i = 0; i < 2; i++) {
            sparkleTrails.push({
              x: clientX + (Math.random() - 0.5) * 20,
              y: clientY + (Math.random() - 0.5) * 20,
              size: 2.5 + Math.random() * 4.5,
              alpha: 0.9,
              vx: (Math.random() - 0.5) * 1.5,
              vy: -0.8 - Math.random() * 1.5,
              color: Math.random() > 0.5 ? '#fda4af' : '#fef08a'
            });
          }
        };

        window.addEventListener('pointermove', handlePointer);
        window.addEventListener('touchstart', handlePointer);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // 1. Draw drifting petals
          for (let p of petals) {
            p.y += p.speedY;
            p.x += Math.sin(p.angle) * 0.8 + p.speedX;
            p.angle += p.spinSpeed;

            if (p.y > height + 20) {
              p.y = -20;
              p.x = Math.random() * width;
            }
            if (p.x > width + 20) p.x = -20;
            if (p.x < -20) p.x = width + 20;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;

            if (p.type === 'heart') {
              ctx.beginPath();
              const s = p.size * 0.65;
              ctx.moveTo(0, s / 3);
              ctx.bezierCurveTo(-s, -s / 2, -s, s, 0, s * 1.5);
              ctx.bezierCurveTo(s, s, s, -s / 2, 0, s / 3);
              ctx.fill();
            } else {
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          // 2. Draw interactive sparkle trail
          for (let i = sparkleTrails.length - 1; i >= 0; i--) {
            const sp = sparkleTrails[i];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.alpha -= 0.025;

            if (sp.alpha <= 0) {
              sparkleTrails.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = sp.alpha;
            ctx.fillStyle = sp.color;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('pointermove', handlePointer);
          window.removeEventListener('touchstart', handlePointer);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-10" aria-hidden="true" />;
    };

    // =========================================================================
    // 3. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // 1. Intro Stage & Typewriter
      const [introStage, setIntroStage] = useState('heart'); // 'heart' -> 'opened' -> 'garden'
      const [bouquetBloomed, setBouquetBloomed] = useState(false);
      const [showHeartQuote, setShowHeartQuote] = useState(false);
      const [typedText, setTypedText] = useState('');
      const fullHeroQuote = "Amar ragi baccha ta, ektu shono na… ar rag kore theko na, please. 🥺❤️";

      // 2. Interactive Petal Bursts
      const [petalBurst, setPetalBurst] = useState([]);

      // 3. Love Letter Envelope
      const [letterOpened, setLetterOpened] = useState(true);

      // 4. Emotional Response State ("Ektu Ador Koro" vs "Ami Ekhono Rag Kore Achi")
      const [emotionalChoice, setEmotionalChoice] = useState(null);

      // 5. Final Sunset Acceptance State (Visitor decides if she accepts flowers!)
      const [acceptedSunset, setAcceptedSunset] = useState(false);

      // 6. Memories Timeline with LocalStorage Persistence
      const STORAGE_KEY = 'pakhi_cherished_memories_v2';
      const [memories, setMemories] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return DEFAULT_MEMORIES;
      });
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
        } catch (e) {}
      }, [memories]);

      // 7. Complete Audio Player Engine
      const audioRef = useRef(null);
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0); // 0 = Surprise Song
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.85);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlaylistDrawer, setShowPlaylistDrawer] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      // 8. Sunset Sky Lanterns
      const [skyLanterns, setSkyLanterns] = useState([]);

      const currentTrack = PLAYLIST[currentTrackIndex];

      // Toast Notification Helper
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 4500);
      };

      // Confetti & Petals Explosion Helper
      const launchCelebration = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 50,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ffffff']
          });
        }
      };

      // Play Specific Track by Index
      const playTrack = (index) => {
        setCurrentTrackIndex(index);
        const targetTrack = PLAYLIST[index];
        if (audioRef.current) {
          audioRef.current.src = targetTrack.src;
          audioRef.current.currentTime = 0;
          audioRef.current.play().then(() => {
            setIsPlaying(true);
            triggerToast(`Playing: ${targetTrack.title} — ${targetTrack.subtitle} 🎶`);
          }).catch(err => {
            console.warn("Audio play prevented:", err);
            triggerToast(`Tap Play to start: ${targetTrack.title} 🎵`);
          });
        }
      };

      // Toggle Play/Pause
      const togglePlayPause = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => {
            console.warn(err);
          });
        }
      };

      // Dedicated Button Click — Plays Surprise Love Song (Hidden Title)
      const handleDedicatedSurpriseClick = () => {
        const surpriseIndex = PLAYLIST.findIndex(t => t.id === 'surprise-song');
        launchCelebration();

        if (currentTrackIndex === surpriseIndex && isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
          triggerToast("⏸️ Paused our surprise song");
          return;
        }

        playTrack(surpriseIndex);
        triggerToast("💖 Playing Nahid’s special surprise song for Pakhi!");
      };

      // Track Ended -> Auto-play Next Song
      const handleAudioEnded = () => {
        const nextIndex = (currentTrackIndex + 1) % PLAYLIST.length;
        playTrack(nextIndex);
      };

      // Audio Time Update
      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
          setDuration(audioRef.current.duration || 0);
        }
      };

      // Format Seconds to MM:SS
      const formatTime = (sec) => {
        if (isNaN(sec) || sec === 0) return '0:00';
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // Handle Scrubber Seek
      const handleSeek = (e) => {
        const newTime = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = newTime;
          setCurrentTime(newTime);
        }
      };

      // Handle Volume
      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (audioRef.current) {
          audioRef.current.volume = val;
          setIsMuted(val === 0);
        }
      };

      const toggleMute = () => {
        if (!audioRef.current) return;
        if (isMuted) {
          audioRef.current.volume = volume || 0.8;
          setIsMuted(false);
        } else {
          audioRef.current.volume = 0;
          setIsMuted(true);
        }
      };

      // Intro Heart Unlock (Opens quietly without autoplay)
      const handleOpenIntroHeart = () => {
        setIntroStage('opened');
        launchCelebration();

        setTimeout(() => {
          setIntroStage('garden');
        }, 1600);
      };

      // Typewriter Quote Triggered when Bouquet is Tapped
      const handleBouquetClick = () => {
        setBouquetBloomed(true);
        setShowHeartQuote(true);
        launchCelebration();

        // Spawn floating rose petals
        const burst = Array.from({ length: 14 }).map((_, i) => ({
          id: Date.now() + i,
          left: 20 + Math.random() * 60,
          emoji: i % 2 === 0 ? '🌹' : '💖'
        }));
        setPetalBurst(burst);

        // Typewriter animation
        let idx = 0;
        setTypedText('');
        const interval = setInterval(() => {
          idx += 1;
          setTypedText(fullHeroQuote.slice(0, idx));
          if (idx >= fullHeroQuote.length) clearInterval(interval);
        }, 38);
      };

      // Update Memory
      const handleUpdateMemory = (id, field, value) => {
        setMemories(prev => prev.map(m => (m.id === id ? { ...m, [field]: value } : m)));
      };

      // Add New Chapter
      const handleAddChapter = () => {
        const nextNum = memories.length + 1;
        const newChapter = {
          id: `chapter-${Date.now()}`,
          badge: `Chapter 0${nextNum}`,
          title: `Our New Memory Together 💖`,
          date: `Today & Always`,
          description: `Write down something beautiful we did or said today...`
        };
        setMemories(prev => [...prev, newChapter]);
        setEditingId(newChapter.id);
      };

      // Launch Sunset Sky Lantern
      const handleSendSkyLantern = () => {
        launchCelebration();
        const lanternMessages = [
          "Amar Shundori Pakhi 🕊️",
          "Always Yours, Nahid ❤️",
          "Forever & Always 💫",
          "Nahid Loves Pakhi 💖",
          "Tomake Khub Bhalobashi 🌹"
        ];
        const randomMsg = lanternMessages[Math.floor(Math.random() * lanternMessages.length)];
        const newLantern = {
          id: Date.now() + Math.random(),
          left: 30 + Math.random() * 40,
          text: randomMsg
        };
        setSkyLanterns(prev => [...prev.slice(-6), newLantern]);
        triggerToast("A glowing lantern carrying your love has been sent to the sky 🌅");
      };

      return (
        <div className="relative min-h-screen bg-gradient-to-b from-rose-50 via-pink-50/70 to-amber-50/50 text-rose-950">
          {/* Background Romantic Petals & Interactive Glow Canvas */}
          <RomanticParticleCanvas />

          {/* Hidden Core Audio Element */}
          <audio
            ref={audioRef}
            src={currentTrack.src}
            preload="auto"
            onTimeUpdate={handleTimeUpdate}
            onEnded={handleAudioEnded}
          />

          {/* Floating Live Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-rose-900/95 text-white px-5 py-2.5 rounded-full shadow-2xl border border-rose-300/50 text-xs sm:text-sm font-semibold flex items-center gap-2 animate-bounce">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* =============================================================== */}
          {/* FLOATING MUSIC BAR & EQUALIZER CONSOLE (Top-Right Glassmorphism) */}

                    <img
                      src="stickers/couple-hug.png"
                      alt="Warm couple embrace"
                      className="w-full object-contain sticker-shadow rounded-2xl"
                    />
                  </picture>
                </div>
                <div className="text-3xl mb-2 animate-bounce">🤗💞🌸</div>
                <p className="font-serif text-xl sm:text-2xl font-bold text-rose-900 leading-relaxed">
                  “Asho amar Pakhi, shob obhiman bhule ektu kache asho. Tomake buke joriye rakhi. ❤️”
                </p>
              </div>
            )}

            {emotionalChoice === 'rag' && (
              <div className="mt-8 bg-white/95 backdrop-blur-md border-2 border-rose-300 rounded-3xl p-6 sm:p-8 shadow-2xl animate-fadeIn max-w-lg mx-auto">
                <div className="max-w-[160px] mx-auto mb-4">
                  <picture>
                    <source srcSet="stickers/pakhi-angry.webp" type="image/webp" />
                    <img
                      src="stickers/pakhi-angry.png"
                      alt="Pakhi taking her time"
                      className="w-full object-contain sticker-shadow rounded-2xl"
                    />
                  </picture>
                </div>
                <div className="text-3xl mb-2 animate-float-slow">🥺🌷🕊️</div>
                <p className="font-serif text-xl sm:text-2xl font-semibold text-rose-900 leading-relaxed">
                  “Thik ache, amar Pakhi. Tumi joto khon shomoy chao nao. Ami tomar kotha shunte ar tomake bujhte ekhanei achi. 🌷”
                </p>
              </div>
            )}
          </section>

          {/* =============================================================== */}
          {/* THE LITTLE MEMORIES SECTION — "OUR LITTLE WORLD ❤️"             */}
          {/* =============================================================== */}
          <section className="py-12 sm:py-16 px-4 max-w-4xl mx-auto">
            <div className="text-center mb-10">
              <span className="text-xs font-bold uppercase tracking-widest text-rose-500">
                Cherished Keepsake Timeline
              </span>
              <h2 className="font-serif text-3xl sm:text-5xl font-bold text-rose-950 mt-1">
                Our Little World ❤️
              </h2>
              <p className="text-xs sm:text-sm text-rose-700 mt-2 font-medium">
                Saved permanently in browser storage. Tap any memory to edit, or add new chapters!
              </p>
            </div>

            <div className="relative border-l-2 border-rose-300 ml-3 sm:ml-8 pl-5 sm:pl-8 space-y-6">
              {memories.map((mem) => {
                const isEditing = editingId === mem.id;
                return (
                  <div
                    key={mem.id}
                    className="relative bg-white/90 backdrop-blur-md border border-rose-200/90 rounded-2xl p-5 sm:p-6 shadow-md hover:shadow-lg transition-shadow"
                  >
                    {/* Glowing Timeline Dot */}
                    <span className="absolute -left-[29px] sm:-left-[41px] top-6 w-4 h-4 rounded-full bg-rose-500 ring-4 ring-rose-100" />

                    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                      <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700">
                        {mem.badge}
                      </span>
                      <button
                        onClick={() => setEditingId(isEditing ? null : mem.id)}
                        className="text-xs font-bold text-rose-600 hover:text-rose-900 underline"
                      >
                        {isEditing ? 'Save Changes ✓' : 'Edit Memory ✏️'}
                      </button>
                    </div>

                    <h3 className="font-serif text-xl sm:text-2xl font-bold text-rose-950">
                      {mem.title}
                    </h3>

                    {isEditing ? (
                      <div className="mt-3 space-y-2.5">
                        <input
                          type="text"
                          value={mem.title}
                          onChange={(e) => handleUpdateMemory(mem.id, 'title', e.target.value)}
                          className="w-full text-sm font-bold px-3 py-2 rounded-xl border border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400"
                          placeholder="Chapter Title..."
                        />
                        <input
                          type="text"
                          value={mem.date}
                          onChange={(e) => handleUpdateMemory(mem.id, 'date', e.target.value)}
                          className="w-full text-xs sm:text-sm px-3 py-2 rounded-xl border border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400"
                          placeholder="Date or Location..."
                        />
                        <textarea
                          rows="3"
                          value={mem.description}
                          onChange={(e) => handleUpdateMemory(mem.id, 'description', e.target.value)}
                          className="w-full text-sm sm:text-base px-3 py-2 rounded-xl border border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400"
                          placeholder="Write our sweet memory here..."
                        />
                      </div>
                    ) : (
                      <>
                        <p className="text-xs font-semibold text-rose-500 mt-0.5 mb-2">
                          {mem.date}
                        </p>
                        <p className="text-sm sm:text-base text-rose-900/95 leading-relaxed">
                          {mem.description}
                        </p>
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Add New Memory Chapter Button */}
            <div className="mt-8 text-center">
              <button
                onClick={handleAddChapter}
                className="inline-flex items-center gap-2 bg-white/90 hover:bg-rose-50 border border-rose-300 text-rose-800 font-bold text-sm px-6 py-2.5 rounded-full shadow-sm active:scale-95 transition-all"
              >
                <span>➕ Add a New Chapter Together</span>
              </button>
            </div>
          </section>

          {/* =============================================================== */}
          {/* THE FINAL PAGE — SHE ACCEPTS THE FLOWERS 🌹💗 (The Climax)     */}
          {/* =============================================================== */}
          <footer className="relative mt-12 pt-16 pb-24 px-4 bg-gradient-to-b from-rose-100/70 via-rose-300/80 to-rose-950 text-white overflow-hidden">
            {/* Animated Sky Lanterns */}
            <div className="pointer-events-none absolute inset-0 overflow-hidden">
              {skyLanterns.map((l) => (
                <div
                  key={l.id}
                  className="absolute bottom-20 flex flex-col items-center animate-lantern"
                  style={{ left: `${l.left}%` }}
                >
                  <span className="text-4xl filter drop-shadow-[0_0_15px_#f59e0b]">🏮</span>
                  <span className="text-[10px] font-bold text-amber-200 bg-rose-950/80 px-2 py-0.5 rounded-full mt-1 border border-amber-300/40">
                    {l.text}
                  </span>
                </div>
              ))}
            </div>

            <div className="max-w-4xl mx-auto text-center relative z-10">
              <span className="inline-block text-xs font-bold uppercase tracking-widest text-rose-950 bg-white/90 px-4 py-1 rounded-full mb-3 shadow-md">
                Sunset Promise 🌅
              </span>

              <h2 className="font-serif text-3xl sm:text-5xl font-bold text-rose-950 mb-6">
                Always Listening, Always Yours
              </h2>

              {/* Sunset Garden Scene Container */}
              <div className="relative max-w-2xl mx-auto rounded-3xl overflow-hidden shadow-2xl border-2 border-white/80 bg-gradient-to-b from-amber-200/40 via-rose-900/60 to-rose-950 p-6 sm:p-10 text-white backdrop-blur-md">
                {/* Glowing Heart Backdrop Aura */}
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-gradient-to-tr from-amber-400/40 via-rose-500/50 to-pink-500/30 blur-2xl pointer-events-none" />

                {/* State Transition: Offering Bouquet (Hesitant) vs Accepting Flowers (Embrace) */}
                {!acceptedSunset ? (
                  /* Initial State: Nahid Offering Flowers, Pakhi Looking Shy/Hesitant */
                  <div className="relative z-10 flex flex-col items-center animate-fadeIn">
                    <div className="max-w-sm mx-auto mb-6">
                      <picture>
                        <source srcSet="stickers/couple-flower-apology.webp" type="image/webp" />
                        <img
                          src="stickers/couple-flower-apology.png"
                          alt="Nahid offering flowers at sunset"
                          className="w-full max-h-[380px] object-contain sticker-sunset-shadow"
                        />
                      </picture>
                    </div>

                    <p className="font-serif italic text-lg sm:text-xl text-rose-100 max-w-md mx-auto mb-4">
                      “Nahid is standing with the flowers, waiting patiently with all his heart…”
                    </p>

                    <button
                      onClick={() => {
                        setAcceptedSunset(true);
                        launchCelebration();
                      }}
                      className="group inline-flex items-center gap-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-400 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-base sm:text-lg px-8 py-3.5 rounded-full shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95"
                    >
                      <span className="text-xl">💐</span>
                      <span>Accept the Flowers 🌹💗</span>
                    </button>
                  </div>
                ) : (
                  /* Accepted State: Warm Embrace with Glowing Heart & Acceptance Message */
                  <div className="relative z-10 flex flex-col items-center animate-fadeIn">
                    <div className="max-w-[260px] sm:max-w-[300px] mx-auto mb-6 animate-breathe">
                      <picture>
                        <source srcSet="stickers/couple-hug.webp" type="image/webp" />
                        <img
                          src="stickers/couple-hug.png"
                          alt="Pakhi happily accepts and hugs Nahid"
                          className="w-full object-contain sticker-sunset-shadow rounded-2xl"
                        />
                      </picture>
                    </div>

                    <div className="space-y-4 max-w-xl mx-auto">
                      <p className="font-serif italic text-xl sm:text-2xl text-rose-100 leading-relaxed">
                        “Rag hote pare, obhiman hote pare, kintu ami chai amra dujon dujonke bujhar cheshta kokhono bondho na kori. ❤️”
                      </p>

                      <div className="p-4 rounded-2xl bg-white/10 border border-rose-300/30 backdrop-blur-md">
                        <p className="font-serif text-2xl sm:text-3xl font-bold text-amber-200">
                          “My Shundori Pakhi, these flowers are for you. 🌹”
                        </p>
                        <p className="font-serif text-xl sm:text-2xl font-semibold text-rose-200 mt-2">
                          “I love you, Mahmuda Khanum. — Your Nahid ❤️”
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* Lantern Release Button */}
                <div className="mt-8 pt-4 border-t border-rose-300/20 flex justify-center">
                  <button
                    onClick={handleSendSkyLantern}
                    className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white border border-rose-300/40 font-bold text-sm sm:text-base px-6 py-2.5 rounded-full shadow-lg active:scale-95 transition-all"
                  >
                    <span>Release a Glowing Sky Lantern 🏮❤️</span>
                  </button>
                </div>
              </div>

              {/* ============================================================= */}
              {/* SPECIAL FINALE BOX: SURPRISE SONG FOR PAKHI (Hidden Title)    */}
              {/* ============================================================= */}
              <div id="special-song-section" className="max-w-2xl mx-auto mt-10 relative">
                {/* Glowing Outer Animated Shimmer Ring */}
                <div className="relative p-[3px] rounded-3xl overflow-hidden shadow-2xl">
                  <span className="absolute inset-0 shimmer-conic rounded-3xl" />
                  <span className="absolute -inset-1 bg-gradient-to-r from-rose-600 via-pink-500 to-amber-400 rounded-3xl blur-lg opacity-85 animate-pulse" />

                  {/* Inner Box */}
                  <div className="relative rounded-[22px] bg-gradient-to-br from-rose-950 via-rose-900 to-pink-950 p-6 sm:p-9 text-center border border-rose-300/40 text-white backdrop-blur-md">
                    {/* Top Badge */}
                    <div className="flex items-center justify-center gap-2 mb-3">
                      <span className="text-2xl animate-bounce">💖</span>
                      <span className="text-xs sm:text-sm font-bold uppercase tracking-widest text-amber-300 bg-rose-900/90 px-3.5 py-1 rounded-full border border-amber-300/40 shadow-sm">
                        ✨ Nahid’s Special Choice For Pakhi
                      </span>
                      <span className="text-2xl animate-bounce" style={{ animationDelay: '0.3s' }}>🎶</span>
                    </div>

                    {/* Prominent Requested Title */}
                    <h3 className="font-serif text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-2 leading-tight">
                      I have a special song for you Pakhi, tap to play the song ❤️
                    </h3>

                    <p className="text-xs sm:text-sm text-rose-200/90 max-w-md mx-auto mb-6">
                      Ei gaan-ta shudhu tomar jonno select korechi amar Pakhi. Amar shob bhalobasha diye tomake dilam.
                    </p>

                    {/* The Interactive Glowing Play Button */}
                    <div className="flex justify-center">
                      <button
                        onClick={handleDedicatedSurpriseClick}
                        className="group relative inline-flex items-center gap-3.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-base sm:text-lg px-8 sm:px-10 py-4 rounded-full shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95"
                        aria-label="Tap to play surprise love song"
                      >
                        <span className="text-2xl transition-transform group-hover:scale-125">
                          {isPlaying && currentTrack.id === 'surprise-song' ? '⏸️' : '▶️'}
                        </span>
                        <span className="font-serif tracking-wide text-lg sm:text-xl">
                          {isPlaying && currentTrack.id === 'surprise-song'
                            ? 'Pause Surprise Song 🎶'
                            : 'Tap To Play Our Surprise Song 💖'}
                        </span>
                      </button>
                    </div>

                    {/* Live Equalizer Status when Surprise Song is playing */}
                    {isPlaying && currentTrack.id === 'surprise-song' && (
                      <div className="mt-6 pt-4 border-t border-rose-300/20 flex flex-col items-center gap-2 animate-fadeIn">
                        <div className="flex items-end gap-1 h-6">
                          <span className="w-1.5 bg-rose-400 rounded-full equalizer-bar" />
                          <span className="w-1.5 bg-pink-400 rounded-full equalizer-bar" />
                          <span className="w-1.5 bg-amber-300 rounded-full equalizer-bar" />
                          <span className="w-1.5 bg-rose-300 rounded-full equalizer-bar" />
                          <span className="w-1.5 bg-rose-500 rounded-full equalizer-bar" />
                        </div>
                        <p className="text-xs sm:text-sm font-semibold text-amber-200 animate-pulse">
                          Now Playing: A Special Surprise Song For My Shundori Pakhi ❤️
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <p className="text-xs text-rose-200/80 mt-12">
                Handcrafted with love by Nahid Ibn Zaman for Mahmuda Khanum (Shundori Pakhi) ❤️
              </p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
