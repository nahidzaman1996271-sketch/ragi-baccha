  <style>
    /* ========================================================= */
    /* 1. 100dvh VIEWPORT & 3D BOOK TURNING STYLES               */
    /* ========================================================= */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Global viewport lock: no page-level scrolling */
      background-color: #fff1f2;
    }

    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .book-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      perspective: 2000px;
      perspective-origin: center center;
    }

    .book-page-leaf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Scrollable page container with custom romantic rose scrollbar */
    .page-scroll-container {
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
      touch-action: pan-y;
      scrollbar-width: thin;
      scrollbar-color: rgba(244, 63, 94, 0.45) rgba(255, 241, 242, 0.5);
    }
    .page-scroll-container::-webkit-scrollbar {
      width: 7px;
    }
    .page-scroll-container::-webkit-scrollbar-track {
      background: rgba(255, 241, 242, 0.4);
      border-radius: 9999px;
    }
    .page-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(244, 63, 94, 0.4);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: background 0.2s ease;
    }
    .page-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(225, 29, 72, 0.7);
    }

    /* ========================================================= */
    /* 2. ATMOSPHERE & BACKGROUND MOTION GRAPHICS                */
    /* ========================================================= */
    .atmosphere-gradient {
      background: linear-gradient(
        135deg,
        #fff1f2 0%,
        #ffe4e6 25%,
        #fef3c7 50%,
        #fed7aa 75%,
        #fce7f3 100%
      );
    }

    /* Ultra-Smooth Hardware-Accelerated Glass Cards */
    .glass-glow-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(254, 205, 211, 0.65);
      box-shadow: 0 10px 26px -6px rgba(225, 29, 72, 0.1), 0 0 14px -2px rgba(251, 113, 133, 0.1);

    /* ========================================================= */
    /* 3. RIBBON IDLE SWAY, SHIMMER & NUDGE ANIMATIONS           */
    /* ========================================================= */
    @keyframes ribbonIdleSway {
      0%, 100% { transform: translateY(-50%) rotate(0deg); }
      25% { transform: translateY(-50%) rotate(-2deg); }
      75% { transform: translateY(-50%) rotate(2deg); }
    }

    @keyframes ribbonShimmerSweep {
      0% { transform: translateY(-120%); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translateY(220%); opacity: 0; }
      100% { transform: translateY(220%); opacity: 0; }
    }

    @keyframes ribbonNudgeLeft {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-6px); }
    }
    @keyframes ribbonNudgeRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }
    }

    .animate-ribbon-sway { animation: ribbonIdleSway 3.4s ease-in-out infinite; }
    .animate-ribbon-shimmer { animation: ribbonShimmerSweep 4.5s ease-in-out infinite; }
    .animate-nudge-left { animation: ribbonNudgeLeft 1.8s ease-in-out infinite; }
    .animate-nudge-right { animation: ribbonNudgeRight 1.8s ease-in-out infinite; }

    /* ========================================================= */
    /* 4. ROMANTIC VINTAGE STYLES & GLOWS                        */
    /* ========================================================= */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.45)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 22px rgba(244, 63, 94, 0.75)); transform: scale(1.02); }
    }
    @keyframes gentleBreathing {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.012) translateY(-3px); }
    }
    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes skyLanternDrift {
      0% { transform: translateY(0) translateX(0) scale(0.85); opacity: 0.95; }
      50% { transform: translateY(-160px) translateX(25px) scale(1.1); opacity: 0.9; }
      100% { transform: translateY(-380px) translateX(-35px) scale(0.6); opacity: 0; }
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .animate-float-slow { animation: floatSlow 4.5s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .animate-breathe { animation: gentleBreathing 4s ease-in-out infinite; }
    .animate-spin-slow { animation: spinDisc 9s linear infinite; }
    .animate-lantern { animation: skyLanternDrift 5.5s cubic-bezier(0.2, 0.8, 0.25, 1) forwards; }

    /* Shimmering gradient border animation */
    .shimmer-conic {
      background: conic-gradient(from 0deg, #f43f5e, #fbbf24, #ec4899, #f43f5e);
    }

    /* Soundwave Equalizer Bars */
    .equalizer-bar:nth-child(1) { animation: waveBar 1.1s ease-in-out infinite 0.1s; }
    .equalizer-bar:nth-child(2) { animation: waveBar 0.9s ease-in-out infinite 0.25s; }
    .equalizer-bar:nth-child(3) { animation: waveBar 1.3s ease-in-out infinite 0.05s; }
    .equalizer-bar:nth-child(4) { animation: waveBar 0.8s ease-in-out infinite 0.35s; }
    .equalizer-bar:nth-child(5) { animation: waveBar 1.2s ease-in-out infinite 0.2s; }

    /* Vintage Paper Stationery Card */
    .paper-card {
      background-color: #fffbf5;
      background-image: 
        radial-gradient(at 15% 15%, rgba(254, 205, 211, 0.3) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(253, 230, 138, 0.2) 0px, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(244, 63, 94, 0.06) 31px, rgba(244, 63, 94, 0.06) 32px);
      box-shadow: 0 18px 45px rgba(136, 19, 55, 0.11), inset 0 0 35px rgba(251, 113, 133, 0.06);
    }

    /* Sticker Glow Effect */
    .sticker-shadow {
      filter: drop-shadow(0 10px 18px rgba(225, 29, 72, 0.18)) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.06));
    }
    .sticker-sunset-shadow {
      filter: drop-shadow(0 14px 26px rgba(245, 158, 11, 0.3)) drop-shadow(0 5px 10px rgba(190, 24, 93, 0.2));
    }

    /* Vinyl Record Radial Grooves */
    .vinyl-grooves {
      background: repeating-radial-gradient(
        circle,
        #1c1917 0px,
        #1c1917 4px,
        #292524 5px,
        #1c1917 6px
      );
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // CONFIGURATION: BOOK PAGER & RIBBON SETTINGS
    // =========================================================================
    const BOOK_CONFIG = {
      dragThreshold: 0.35,  // 35% screen width to auto-turn page
      flipDurationMs: 480,  // Snappy, ultra-responsive 480ms transition
      ribbon: {

        knotAccent: '#fbbf24',
        shadow: 'drop-shadow(0 5px 12px rgba(159, 18, 57, 0.35))',
      }
    };

    // =========================================================================
    // 1. PLAYLIST CONFIGURATION — ALL SONGS INCLUDED (Surprise song hidden)
    // =========================================================================
    const PLAYLIST = [
      {
        id: 'surprise-song',
        title: 'A Special Song For You',
        subtitle: 'Nahid’s Surprise Pick For Pakhi 💖',
        src: 'khoka.mp3',

      },
      {

        title: 'Forever',
        subtitle: 'Our Journey Together Always 💫',
        src: 'forever.mp3',
        badge: 'Forever',
        icon: '💫',
        durationHint: 'Timeless'
      }
    ];

    // Default Cherished Memories
    const DEFAULT_MEMORIES = [
      {
        id: 'first-meeting',
        badge: 'Chapter 01',
        title: 'Our First Meeting in That Yellow Dress 💛',
        date: 'First semester, our very first class',
        description: 'The very first day I saw you in that bright yellow dress! My immediate thought was: "Who is this girl? She looks so dangerously cute, I should probably keep my distance!" …little did I know you would become my whole world.'
      },
      {

        badge: 'Chapter 02',
        title: 'Our Favorite Dates & Sweet Walks 💖',
        date: 'End of 1st semester & anywhere we are together',
        description: 'Those quiet walks where nothing else mattered. Just listening to you talk, looking at your expressive eyes, and realizing that home is anywhere you are beside me.'
      },
      {
        id: 'funniest-moment',
        badge: 'Chapter 03',
        title: 'The Transport Incident ("Eta ki ucha hoye ache?") 😂',
        date: 'Inside the campus transport',
        description: 'I know you remember this hilarious moment! When you blurted out "Eta ki ucha hoye ache?" We burst into non-stop laughter and I was so embarrassingly red! One of our most unforgettable memories.'
      },
      {
        id: 'supported-each-other',
        badge: 'Chapter 04',
        title: 'Our Playful Teasing & Constant Support 🤝',
        date: 'Every single day of our lives',
        description: 'We banter, tease, and poke fun at each other every day, but deep down, we both know we are each other’s biggest shelter and truest best friend.'
      },
      {
        id: 'future-dream',
        badge: 'Chapter 05',
        title: 'I Want To Be With You Forever 💍',
        date: 'Our Forever Ahead',
        description: 'I never want to see tears in your eyes. I want to make you smile and laugh every single day. And remember this truth: I am the only one who will happily adore, cherish, and handle all your cute tantrums and angry moods forever!'
      }
    ];

    // =========================================================================
    // 2. ROMANTIC PARTICLE CANVAS ENGINE (Ultra-Fast 60fps Petals)
    // =========================================================================
    const RomanticParticleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: true });
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize, { passive: true });

        // Lightweight 16 petals
        const petals = Array.from({ length: 16 }).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 5 + Math.random() * 7,
          speedY: 0.5 + Math.random() * 0.9,
          speedX: (Math.random() - 0.5) * 0.6,
          angle: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - 0.5) * 0.02,
          color: Math.random() > 0.4 ? 'rgba(251, 113, 133, 0.38)' : 'rgba(244, 63, 94, 0.28)',
          type: Math.random() > 0.5 ? 'petal' : 'heart'
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < petals.length; i++) {
            const p = petals[i];
            p.y += p.speedY;
            p.x += Math.sin(p.angle) * 0.6 + p.speedX;
            p.angle += p.spinSpeed;

            if (p.y > height + 20) {
              p.y = -20;
              p.x = Math.random() * width;
            }
            if (p.x > width + 20) p.x = -20;
            if (p.x < -20) p.x = width + 20;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;

            if (p.type === 'heart') {
              ctx.beginPath();
              const s = p.size * 0.6;
              ctx.moveTo(0, s / 3);
              ctx.bezierCurveTo(-s, -s / 2, -s, s, 0, s * 1.5);
              ctx.bezierCurveTo(s, s, s, -s / 2, 0, s / 3);
              ctx.fill();
            } else {
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" aria-hidden="true" />;
    };

    // =========================================================================
    // 3. ZERO-LAG RIBBON HANDLE COMPONENT
    // =========================================================================
    const RibbonHandle = ({
      position = 'right', // 'right' | 'left'
      onDragStart,
      onDrag,
      onDragEnd,
      onClick,
      isSmall = false,
      ariaLabel = "Turn page",
      hintText,
      isCover = false
    }) => {
      const [isHovered, setIsHovered] = useState(false);
      const dragInfoRef = useRef({ startX: 0, startY: 0, totalDeltaX: 0, startTime: 0, isDragging: false });
      const ribbonStripRef = useRef(null);

      const handlePointerDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;

        e.stopPropagation();
        try {
          e.currentTarget.setPointerCapture(e.pointerId);
        } catch (err) {}

        const startX = e.clientX;
        const startY = e.clientY;
        dragInfoRef.current = {
          startX,
          startY,
          totalDeltaX: 0,
          startTime: Date.now(),
          isDragging: false
        };

        if (onDragStart) onDragStart(startX, startY);
      };

      const handlePointerMove = (e) => {
        const { startX, startTime } = dragInfoRef.current;
        if (startTime === 0) return;
        e.stopPropagation();

        const currentX = e.clientX;
        const rawDelta = position === 'right' ? (startX - currentX) : (currentX - startX);
        const deltaX = Math.max(0, rawDelta);

        if (Math.abs(currentX - startX) > 6) {
          dragInfoRef.current.isDragging = true;
        }

        dragInfoRef.current.totalDeltaX = deltaX;

        // Instant direct DOM stretch without React re-render!
        if (ribbonStripRef.current) {
          const stretch = 1 + Math.min(0.2, deltaX / 600);
          ribbonStripRef.current.style.transform = `scaleX(${stretch})`;
        }

        if (onDrag) onDrag(deltaX, currentX);
      };

      const handlePointerUp = (e) => {
        const { isDragging, totalDeltaX, startTime } = dragInfoRef.current;
        if (startTime === 0) return;
        e.stopPropagation();
        dragInfoRef.current.startTime = 0;

        if (ribbonStripRef.current) {
          ribbonStripRef.current.style.transform = 'scaleX(1)';
        }

        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (err) {}

        const elapsedTime = Date.now() - startTime;

        if (!isDragging || (totalDeltaX < 8 && elapsedTime < 320)) {
          if (onClick) onClick();
          if (onDragEnd) onDragEnd(0);
        } else {
          if (onDragEnd) onDragEnd(totalDeltaX);
        }
      };

      const handlePointerCancel = (e) => {
        dragInfoRef.current.startTime = 0;
        if (ribbonStripRef.current) {
          ribbonStripRef.current.style.transform = 'scaleX(1)';
        }
        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (err) {}
        if (onDragEnd) onDragEnd(0);
      };

      const isRight = position === 'right';
      const ribbonWidth = isCover ? 'w-10 sm:w-12' : (isSmall ? 'w-6 sm:w-7' : 'w-8 sm:w-10');
      const hitboxWidth = isCover ? 'w-16 sm:w-20' : (isSmall ? 'w-10 sm:w-12' : 'w-11 sm:w-14');

      return (
        <div
          role="button"
          tabIndex={0}
          aria-label={ariaLabel}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{ touchAction: isCover ? 'none' : 'pan-y' }}
          className={`absolute top-0 bottom-0 ${isRight ? 'right-0' : 'left-0'} ${hitboxWidth} z-30 flex items-center justify-center select-none cursor-pointer`}
        >
          {/* Satin Ribbon (Fita) Hanging Strip */}
          <div
            ref={ribbonStripRef}
            className={`absolute top-0 bottom-0 ${isRight ? 'right-0 origin-right' : 'left-0 origin-left'} ${ribbonWidth} pointer-events-none overflow-hidden transition-transform duration-75`}
            style={{
              background: isRight ? BOOK_CONFIG.ribbon.nextGradient : BOOK_CONFIG.ribbon.prevGradient,
              boxShadow: isRight
                ? '-4px 0 14px rgba(136, 19, 55, 0.3), inset 1px 0 2px rgba(255, 255, 255, 0.4), inset -1px 0 2px rgba(0, 0, 0, 0.2)'
                : '4px 0 14px rgba(136, 19, 55, 0.3), inset -1px 0 2px rgba(255, 255, 255, 0.4), inset 1px 0 2px rgba(0, 0, 0, 0.2)',
              borderRight: isRight ? '1px dashed rgba(254, 205, 211, 0.5)' : 'none',
              borderLeft: !isRight ? '1px dashed rgba(254, 205, 211, 0.5)' : 'none',
              willChange: 'transform'
            }}
          >
            <div className="absolute inset-x-0 h-28 ribbon-shimmer-sweep animate-ribbon-shimmer pointer-events-none" />
            <div className="absolute inset-0 opacity-25 bg-gradient-to-b from-white/30 via-transparent to-black/25" />
          </div>

          {/* Decorative Bow & Knot Drag Handle */}
          <div
            className={`absolute top-1/2 -translate-y-1/2 z-10 flex flex-col items-center justify-center animate-ribbon-sway transition-transform duration-200`}
            style={{
              filter: BOOK_CONFIG.ribbon.shadow,
              transform: isHovered ? 'translateY(-50%) scale(1.1)' : 'translateY(-50%) scale(1)',
              willChange: 'transform',
              touchAction: 'none'
            }}
          >
            {/* Ribbon Knot SVG */}
            <div className="relative">
              <svg
                viewBox="0 0 100 80"
                className={`${isSmall ? 'w-8 h-7 sm:w-9 sm:h-8' : (isCover ? 'w-14 h-12 sm:w-16 sm:h-14' : 'w-11 h-9 sm:w-13 sm:h-11')} filter drop-shadow-md`}
              >
                <path
                  d="M50 40 C32 15, 8 20, 14 38 C20 54, 42 46, 50 40 Z"
                  fill={isRight ? "#f43f5e" : "#fb7185"}
                  stroke="#ffe4e6"
                  strokeWidth="2"
                />
                <path
                  d="M50 40 C68 15, 92 20, 86 38 C80 54, 58 46, 50 40 Z"
                  fill={isRight ? "#f43f5e" : "#fb7185"}
                  stroke="#ffe4e6"
                  strokeWidth="2"
                />
                <path d="M46 43 C38 58, 26 72, 18 78 L32 74 L42 63 Z" fill="#be123c" />
                <path d="M54 43 C62 58, 74 72, 82 78 L68 74 L58 63 Z" fill="#be123c" />
                <circle cx="50" cy="40" r="8" fill={BOOK_CONFIG.ribbon.knotAccent} stroke="#fef08a" strokeWidth="2" />
                <circle cx="48" cy="38" r="3" fill="#ffffff" opacity="0.8" />
              </svg>

              {isCover && (
                <span className="absolute -inset-1 rounded-full bg-amber-300/40 blur-sm animate-ping -z-10" />
              )}
            </div>

            {hintText ? (
              <div className="absolute right-14 sm:right-16 top-1/2 -translate-y-1/2 whitespace-nowrap bg-rose-950/90 text-amber-200 border border-amber-300/50 text-xs sm:text-sm font-semibold px-3.5 py-1.5 rounded-full shadow-xl animate-nudge-left pointer-events-none flex items-center gap-1.5">
                <span>{hintText}</span>
              </div>
            ) : (
              <span className={`text-[10px] font-bold text-white drop-shadow-md mt-0.5 select-none ${isSmall ? 'text-[8px]' : ''}`}>
                {isRight ? '◀' : '▶'}
              </span>
            )}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 4. OPENING COVER COMPONENT (Zero-Lag 3D Peel, No Autoplay)
    // =========================================================================
    const OpeningCover = ({
      isOpen,
      onOpenCover
    }) => {
      const [isComplete, setIsComplete] = useState(false);
      const coverLeafRef = useRef(null);
      const isDraggingRef = useRef(false);

      if (isOpen && isComplete) return null;

      const handleDragStart = () => {
        isDraggingRef.current = true;
        if (coverLeafRef.current) {
          coverLeafRef.current.style.transition = 'none';
        }
      };

      const handleDrag = (deltaX) => {
        if (!isDraggingRef.current || !coverLeafRef.current) return;
        const screenWidth = window.innerWidth || 1000;
        const progress = Math.min(1, Math.max(0, deltaX / screenWidth));
        const angle = -(progress * 180);
        coverLeafRef.current.style.transform = `rotateY(${angle}deg)`;
      };

      const handleDragEnd = (deltaX) => {
        isDraggingRef.current = false;
        const screenWidth = window.innerWidth || 1000;
        const progress = deltaX / screenWidth;

        if (progress >= BOOK_CONFIG.dragThreshold) {
          completeCoverTurn();
        } else {
          if (coverLeafRef.current) {
            coverLeafRef.current.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
            coverLeafRef.current.style.transform = 'rotateY(0deg)';
          }
        }
      };

      const completeCoverTurn = () => {
        if (coverLeafRef.current) {
          coverLeafRef.current.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
          coverLeafRef.current.style.transform = 'rotateY(-180deg)';
        }

        if (window.confetti) {
          window.confetti({
            particleCount: 40,
            spread: 70,
            origin: { x: 0.5, y: 0.5 },
            colors: ['#f43f5e', '#fbbf24', '#ffffff']
          });
        }

        setTimeout(() => {
          setIsComplete(true);
          onOpenCover();
        }, BOOK_CONFIG.flipDurationMs);
      };

      return (
        <div
          className="fixed inset-0 z-50 overflow-hidden pointer-events-auto select-none"
          style={{ perspective: '2000px' }}
        >
          {/* 3D Turning Leaf for the Cover */}
          <div
            ref={coverLeafRef}
            className="relative w-full h-full"
            style={{
              transformOrigin: 'left center',
              transform: 'rotateY(0deg)',
              transformStyle: 'preserve-3d',
              willChange: 'transform'
            }}
          >
            {/* Front Face */}
            <div
              className="absolute inset-0 w-full h-full flex flex-col items-center justify-center text-center p-6 bg-gradient-to-br from-rose-950 via-rose-900 to-amber-950 text-white overflow-hidden"
              style={{ backfaceVisibility: 'hidden' }}
            >
              <div className="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-200 via-rose-500 to-transparent" />
              <div className="absolute inset-4 sm:inset-8 border-2 border-amber-300/30 rounded-3xl pointer-events-none" />

              {/* Center Content */}
              <div className="relative z-10 max-w-md w-full flex flex-col items-center px-4">
                {/* maf.jpg Portrait */}
                <div className="relative flex items-center justify-center w-36 h-36 sm:w-44 sm:h-44 rounded-full p-1.5 bg-gradient-to-tr from-amber-400 via-rose-400 to-pink-300 border-4 border-amber-200/90 shadow-2xl animate-pulse-glow mb-6 overflow-hidden">
                  <img
                    src="maf.jpg"
                    alt="Amar Shundori Pakhi — Maf"
                    className="w-full h-full object-cover rounded-full select-none pointer-events-none"
                  />
                  <span className="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-rose-600 border-2 border-white flex items-center justify-center text-sm shadow-md animate-bounce">
                    ❤️
                  </span>
                </div>

                <p className="text-amber-200/90 text-xs sm:text-sm uppercase tracking-widest mb-2 font-semibold">
                  A Handwritten Apology From Nahid Ibn Zaman
                </p>

                <h1 className="font-serif text-2xl sm:text-4xl font-semibold text-white mb-4 leading-tight">
                  For My Ragi Baccha, My Shundori Pakhi ❤️
                </h1>

                <p className="font-serif italic text-rose-200 text-sm sm:text-base max-w-xs mb-8">
                  “Amar ragi baccha ta, ektu shono na… ar rag kore theko na, please. 🥺❤️”
                </p>

                <button
                  onClick={completeCoverTurn}
                  className="group inline-flex items-center gap-2 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm sm:text-base px-7 py-3 rounded-full shadow-2xl transition-transform duration-200 active:scale-95"

              {/* Ribbon (No music autoplay) */}

                position="right"
                onDragStart={handleDragStart}
                onDrag={handleDrag}
                onDragEnd={handleDragEnd}
                onClick={completeCoverTurn}
                isCover={true}

                hintText="Slide the ribbon to open 🎀"

            {/* Backside of Cover */}

              className="absolute inset-0 w-full h-full bg-[#fcf8f2] border-r-4 border-rose-300 shadow-2xl flex items-center justify-center p-8 text-center"

                backfaceVisibility: 'hidden',
                boxShadow: 'inset 25px 0 50px rgba(0,0,0,0.15)'
              }}

    // =========================================================================
    // 5. ROCK-SOLID BOOK PAGER COMPONENT (Zero-Vanish, Ultra-Smooth Transitions)
    // =========================================================================
    const BookPager = ({
      pages,
      currentPage,
      onPageChange
    }) => {
      const totalPages = pages.length;
      const isFlippingRef = useRef(false);
      const leafRefs = useRef([]);
      const wheelCooldownRef = useRef(0);
      const touchStartRef = useRef({ x: 0, y: 0, time: 0 });

      // Programmatic Navigation
      const goToPage = (targetIdx) => {
        if (isFlippingRef.current || targetIdx === currentPage || targetIdx < 0 || targetIdx >= totalPages) return;

        const isNext = targetIdx > currentPage;
        isFlippingRef.current = true;

        if (window.confetti) {
          window.confetti({
            particleCount: 16,
            spread: 50,
            origin: { x: isNext ? 0.8 : 0.2, y: 0.5 },
            colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ffffff']
          });
        }

        if (isNext) {
          // Turning forward: current page turns to -180deg
          const leaf = leafRefs.current[currentPage];
          if (leaf) {
            leaf.style.zIndex = '20';
            leaf.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
            leaf.style.transform = 'rotateY(-180deg)';
          }
        } else {
          // Turning backward: target page swings from -180deg to 0deg on top!
          const leaf = leafRefs.current[targetIdx];
          if (leaf) {
            leaf.style.visibility = 'visible';
            leaf.style.zIndex = '30';
            leaf.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
            leaf.style.transform = 'rotateY(0deg)';
          }
        }

        setTimeout(() => {
          onPageChange(targetIdx);
          isFlippingRef.current = false;
        }, BOOK_CONFIG.flipDurationMs);
      };

      const goToNextPage = () => {
        if (currentPage < totalPages - 1) {
          goToPage(currentPage + 1);
        }
      };

      const goToPrevPage = () => {
        if (currentPage > 0) {
          goToPage(currentPage - 1);
        }
      };

      // Keyboard Arrows: Only horizontal arrows flip pages; vertical arrows/PageDown scroll naturally
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            goToNextPage();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            goToPrevPage();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentPage]);

      // Reset scroll position to top whenever navigating to a page
      useEffect(() => {
        const leaf = leafRefs.current[currentPage];
        if (leaf) {
          const scroller = leaf.querySelector('.page-scroll-container');
          if (scroller) {
            scroller.scrollTop = 0;
          }
        }
      }, [currentPage]);

      // Mouse Wheel Navigation: ONLY horizontal trackpad / shift+wheel gestures flip pages
      // Normal vertical mouse wheel (deltaY) scrolls smoothly so the user can read all handwritten content
      const handleWheel = (e) => {
        if (isFlippingRef.current) return;

        // Support intentional horizontal swipe / shift+wheel on trackpads
        if (Math.abs(e.deltaX) > 45 && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.5) {
          const now = Date.now();
          if (now - wheelCooldownRef.current < 650) return;

          if (e.deltaX > 45) {
            wheelCooldownRef.current = now;
            goToNextPage();
          } else if (e.deltaX < -45) {
            wheelCooldownRef.current = now;
            goToPrevPage();
          }
        }
      };

      // Touch Horizontal Swipe Gesture Detection
      const handleTouchStart = (e) => {
        if (e.touches.length !== 1) return;
        touchStartRef.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY,
          time: Date.now()
        };
      };

      const handleTouchEnd = (e) => {
        if (isFlippingRef.current) return;
        const dx = e.changedTouches[0].clientX - touchStartRef.current.x;
        const dy = e.changedTouches[0].clientY - touchStartRef.current.y;
        const dt = Date.now() - touchStartRef.current.time;

        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 450) {
          if (dx < 0) {
            goToNextPage();
          } else {
            goToPrevPage();
          }
        }
      };

      // Fast Direct GPU Drag Handling
      const handleRibbonDragStart = (direction) => {
        if (isFlippingRef.current) return;
        const leaf = direction === 'next' ? leafRefs.current[currentPage] : leafRefs.current[currentPage - 1];
        if (leaf) {
          leaf.style.transition = 'none';
          if (direction === 'prev') {
            leaf.style.visibility = 'visible';
            leaf.style.zIndex = '30';
          } else {
            leaf.style.zIndex = '20';
          }
        }
      };

      const handleRibbonDrag = (deltaX, direction) => {
        if (isFlippingRef.current) return;
        const screenWidth = window.innerWidth || 1000;
        const progress = Math.min(1, Math.max(0, deltaX / screenWidth));

        if (direction === 'next') {
          const leaf = leafRefs.current[currentPage];
          if (leaf) {
            leaf.style.transform = `rotateY(${-(progress * 180)}deg)`;
          }
        } else if (direction === 'prev' && currentPage > 0) {
          const leaf = leafRefs.current[currentPage - 1];
          if (leaf) {
            leaf.style.transform = `rotateY(${-180 + progress * 180}deg)`;
          }
        }
      };

      const handleRibbonDragEnd = (deltaX, direction) => {
        if (isFlippingRef.current) return;
        const screenWidth = window.innerWidth || 1000;
        const progress = deltaX / screenWidth;

        if (progress >= BOOK_CONFIG.dragThreshold) {
          if (direction === 'next' && currentPage < totalPages - 1) {
            goToNextPage();
          } else if (direction === 'prev' && currentPage > 0) {
            goToPrevPage();
          }
        } else {
          // Snap back
          if (direction === 'next') {
            const leaf = leafRefs.current[currentPage];
            if (leaf) {
              leaf.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
              leaf.style.transform = 'rotateY(0deg)';
            }
          } else if (direction === 'prev' && currentPage > 0) {
            const leaf = leafRefs.current[currentPage - 1];
            if (leaf) {
              leaf.style.transition = `transform ${BOOK_CONFIG.flipDurationMs}ms cubic-bezier(0.2, 0.8, 0.25, 1)`;
              leaf.style.transform = 'rotateY(-180deg)';
            }
          }
        }
      };

      return (
        <div
          onWheel={handleWheel}
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
          className="book-container relative w-full h-[100dvh] overflow-hidden"
        >
          {/* 4 Book Pages */}
          {pages.map((PageComponent, idx) => {
            const isTurned = idx < currentPage;
            const isCurrent = idx === currentPage;
            const isVisible = Math.abs(idx - currentPage) <= 1; // Only render adjacent leaves for 60fps
            const zIndex = isCurrent ? 10 : (idx < currentPage ? 1 : 5);

            return (
              <div
                key={idx}
                ref={(el) => (leafRefs.current[idx] = el)}
                className="book-page-leaf absolute inset-0 w-full h-full"
                style={{
                  transformOrigin: 'left center',
                  transform: isTurned ? 'rotateY(-180deg)' : 'rotateY(0deg)',
                  zIndex,
                  visibility: isVisible ? 'visible' : 'hidden',
                  transformStyle: 'preserve-3d'
                }}
              >
                {/* Front Face of the Page (Solid, Never Vanishes) */}
                <div
                  className="absolute inset-0 w-full h-full atmosphere-gradient text-rose-950 overflow-hidden"
                  style={{
                    backfaceVisibility: 'hidden',
                    pointerEvents: isCurrent ? 'auto' : 'none'
                  }}
                >
                  {/* Inner scrollable container for small screens */}
                  <div className="page-scroll-container">
                    <PageComponent isActive={isCurrent} goToPage={goToPage} />
                  </div>

                  {/* Right Ribbon (Next Page) */}
                  {idx < totalPages - 1 && isCurrent && (
                    <RibbonHandle
                      position="right"
                      onDragStart={() => handleRibbonDragStart('next')}
                      onDrag={(dx) => handleRibbonDrag(dx, 'next')}
                      onDragEnd={(dx) => handleRibbonDragEnd(dx, 'next')}
                      onClick={goToNextPage}
                      ariaLabel={`Turn to Page ${idx + 2}`}
                      hintText=""
                    />
                  )}

                  {/* Left Ribbon (Previous Page) */}
                  {idx > 0 && isCurrent && (
                    <RibbonHandle
                      position="left"
                      isSmall={true}
                      onDragStart={() => handleRibbonDragStart('prev')}
                      onDrag={(dx) => handleRibbonDrag(dx, 'prev')}
                      onDragEnd={(dx) => handleRibbonDragEnd(dx, 'prev')}
                      onClick={goToPrevPage}
                      ariaLabel={`Turn back to Page ${idx}`}
                      hintText=""
                    />
                  )}
                </div>

                {/* Backside Parchment Paper */}
                <div
                  className="absolute inset-0 w-full h-full paper-card border-r-2 border-rose-200/90 shadow-2xl flex items-center justify-center p-8 select-none"
                  style={{
                    transform: 'rotateY(180deg)',
                    backfaceVisibility: 'hidden',
                    boxShadow: 'inset 25px 0 45px rgba(0, 0, 0, 0.12)'
                  }}
                >
                  <div className="opacity-25 flex flex-col items-center">
                    <span className="text-4xl mb-2">🕊️</span>
                    <p className="font-serif italic text-sm text-rose-900">For My Shundori Pakhi — Nahid</p>
                  </div>
                </div>
              </div>
            );
          })}

          {/* Bottom Progress Bar: 4 Knot Dots */}
          <nav
            aria-label="Page navigation"
            className="fixed bottom-3.5 left-1/2 -translate-x-1/2 z-40 bg-white/90 backdrop-blur-md border border-rose-200/90 shadow-xl px-4 py-1.5 rounded-full flex items-center gap-3"
          >
            {[0, 1, 2, 3].map((dotIdx) => {
              const isActive = currentPage === dotIdx;
              const pageLabels = [
                'Page 1: The Flower Apology 🌹',
                'Page 2: The Emotional Letter 💌',
                'Page 3: Memories & Feelings 💖',
                'Page 4: Sunset Promise 🌅'
              ];
              return (
                <button
                  key={dotIdx}
                  onClick={() => goToPage(dotIdx)}
                  title={pageLabels[dotIdx]}
                  aria-label={pageLabels[dotIdx]}
                  className={`relative flex items-center justify-center transition-transform duration-200 ${
                    isActive
                      ? 'w-8 h-8 rounded-full bg-rose-600 text-white font-bold text-xs shadow-md ring-2 ring-rose-300 scale-110'
                      : 'w-6 h-6 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold text-[10px]'
                  }`}
                >
                  {isActive ? '🎀' : dotIdx + 1}
                </button>
              );
            })}

            {/* Read Again button when on Page 4 */}
            {currentPage === 3 && (
              <button
                onClick={() => goToPage(0)}
                className="ml-2 pl-2 border-l border-rose-200 text-xs font-bold text-rose-700 hover:text-rose-950 flex items-center gap-1 transition-colors"
              >
                <span>Read again 🔁</span>
              </button>
            )}
          </nav>
        </div>
      );
    };

    // =========================================================================
    // 6. ROCK-SOLID PAGE COMPONENTS (Visible, Never Vanishing, Crisp)
    // =========================================================================

                <button
                  onClick={handleSendSkyLantern}
                  className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white border border-rose-300/40 font-bold text-xs sm:text-sm px-5 py-2 rounded-full shadow-lg active:scale-95 transition-all"
                >
                  <span>Release a Glowing Sky Lantern 🏮❤️</span>
                </button>
              </div>
            </div>

            {/* Read Again 🔁 Action Button */}
            <div className="mt-6 flex justify-center">
              <button
                onClick={() => {
                  goToPage(0);
                  if (window.confetti) {
                    window.confetti({ particleCount: 35, spread: 60, origin: { y: 0.6 } });
                  }
                }}
                className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white border border-rose-300/40 font-bold text-xs sm:text-sm px-6 py-2 rounded-full shadow-md active:scale-95 transition-all"
              >
                <span>Read again 🔁</span>
              </button>
            </div>

            <p className="text-[11px] sm:text-xs text-rose-200/80 mt-6">
              Handcrafted with love by Nahid Ibn Zaman for Mahmuda Khanum (Shundori Pakhi) ❤️
            </p>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 7. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [isCoverOpen, setIsCoverOpen] = useState(false);
      const [currentPage, setCurrentPage] = useState(0);

      // Audio Player Engine (Fixed outside pages so music never stops)
      const audioRef = useRef(null);
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.85);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlaylistDrawer, setShowPlaylistDrawer] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const currentTrack = PLAYLIST[currentTrackIndex];

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 4000);
      };

      const playTrack = (index) => {
        setCurrentTrackIndex(index);
        const targetTrack = PLAYLIST[index];
        if (audioRef.current) {
          audioRef.current.src = targetTrack.src;
          audioRef.current.currentTime = 0;
          audioRef.current.play().then(() => {
            setIsPlaying(true);
            triggerToast(`Playing: ${targetTrack.title} — ${targetTrack.subtitle} 🎶`);
          }).catch(err => {
            console.warn("Audio play error:", err);
            triggerToast(`Tap Play to start: ${targetTrack.title} 🎵`);
          });
        }
      };

      const togglePlayPause = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => {
            console.warn(err);
          });
        }
      };

      const handleAudioEnded = () => {
        const nextIndex = (currentTrackIndex + 1) % PLAYLIST.length;
        playTrack(nextIndex);
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
          setDuration(audioRef.current.duration || 0);
        }
      };

      const formatTime = (sec) => {
        if (isNaN(sec) || sec === 0) return '0:00';
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      const handleSeek = (e) => {
        const newTime = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = newTime;
          setCurrentTime(newTime);
        }
      };

      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (audioRef.current) {
          audioRef.current.volume = val;
          setIsMuted(val === 0);
        }
      };

      const toggleMute = () => {
        if (!audioRef.current) return;
        if (isMuted) {
          audioRef.current.volume = volume || 0.8;
          setIsMuted(false);
        } else {
          audioRef.current.volume = 0;
          setIsMuted(true);
        }
      };

      const bookPages = [PageOne, PageTwo, PageThree, PageFour];

      return (
        <div className="relative w-full h-[100dvh] overflow-hidden atmosphere-gradient text-rose-950">
          {/* Background Petals Canvas */}
          <RomanticParticleCanvas />

          {/* Core Audio Element (Music only plays when YOU choose!) */}
          <audio
            ref={audioRef}
            src={currentTrack.src}
            preload="auto"
            onTimeUpdate={handleTimeUpdate}
            onEnded={handleAudioEnded}
          />

          {/* Floating Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-rose-900/95 text-white px-5 py-2.5 rounded-full shadow-2xl border border-rose-300/50 text-xs sm:text-sm font-semibold flex items-center gap-2 animate-bounce">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* =============================================================== */}
          {/* FLOATING MUSIC BAR & EQUALIZER CONSOLE (Top-Right Glassmorphism) */}
          {/* =============================================================== */}
          <aside aria-label="Music player controls" className="fixed top-3 right-3 sm:top-5 sm:right-5 z-40 flex flex-col items-end">
            <div className="flex items-center gap-2 bg-white/95 backdrop-blur-md border border-rose-200/90 shadow-xl rounded-full px-3.5 py-2">
              {/* Spinning Vinyl Disc */}
              <button
                onClick={() => setShowPlaylistDrawer(!showPlaylistDrawer)}
                className="relative w-8 h-8 rounded-full vinyl-grooves border border-amber-300/60 shadow-md flex items-center justify-center cursor-pointer group"
                title="Open romantic playlist"
              >
                <div className={`w-3.5 h-3.5 rounded-full bg-rose-600 border border-white flex items-center justify-center text-[7px] text-white font-bold ${isPlaying ? 'animate-spin-slow' : ''}`}>
                  ❤️
                </div>
              </button>

              {/* Play / Pause Toggle Button */}
              <button
                onClick={togglePlayPause}
                className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-rose-900 hover:text-rose-600 transition-colors"
                aria-label={isPlaying ? "Pause music" : "Play music"}
              >
                <span>{isPlaying ? '⏸️' : '▶️'}</span>
                <span className="max-w-[110px] sm:max-w-[140px] truncate text-left">
                  {isPlaying ? currentTrack.title : 'Play Music'}
                </span>
              </button>

              {/* Equalizer Soundwave Bars when Playing */}
              {isPlaying && (
                <div className="flex items-end gap-0.5 h-5 px-1">
                  <span className="w-1 bg-rose-500 rounded-full equalizer-bar" />
                  <span className="w-1 bg-pink-500 rounded-full equalizer-bar" />
                  <span className="w-1 bg-amber-400 rounded-full equalizer-bar" />
                  <span className="w-1 bg-rose-600 rounded-full equalizer-bar" />
                  <span className="w-1 bg-rose-400 rounded-full equalizer-bar" />
                </div>
              )}

              {/* Playlist Toggle */}
              <button
                onClick={() => setShowPlaylistDrawer(!showPlaylistDrawer)}
                className="ml-1 pl-2 border-l border-rose-200 text-xs font-semibold text-rose-700 hover:text-rose-950 flex items-center gap-1"
                aria-label="Open playlist drawer"
              >
                <span>🎶</span>
                <span className="hidden sm:inline">Songs ({PLAYLIST.length})</span>
              </button>
            </div>

            {/* Expandable Playlist & Scrubber Drawer */}
            {showPlaylistDrawer && (
              <div className="mt-2 w-80 sm:w-96 bg-white/95 backdrop-blur-xl border border-rose-200 rounded-3xl p-4 sm:p-5 shadow-2xl text-rose-950">
                <div className="flex items-center justify-between pb-3 border-b border-rose-100">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📻</span>
                    <div>
                      <h4 className="font-serif font-bold text-base text-rose-950 leading-tight">
                        Our Romantic Jukebox
                      </h4>
                      <p className="text-[11px] text-rose-600 font-medium">All Songs From The Folder</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowPlaylistDrawer(false)}
                    className="text-xs text-rose-400 hover:text-rose-800 font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                {/* Scrubber Bar */}
                <div className="py-3">
                  <div className="flex justify-between text-[11px] font-semibold text-rose-700 mb-1">
                    <span>{formatTime(currentTime)}</span>
                    <span className="text-rose-900 font-bold">{currentTrack.title}</span>
                    <span>{formatTime(duration)}</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max={duration || 100}
                    value={currentTime}
                    onChange={handleSeek}
                    className="w-full accent-rose-600 h-1.5 bg-rose-100 rounded-lg cursor-pointer"
                  />
                </div>

                {/* Volume & Controls Row */}
                <div className="flex items-center justify-between py-2 border-b border-rose-100 text-xs">
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => playTrack((currentTrackIndex - 1 + PLAYLIST.length) % PLAYLIST.length)}
                      className="p-1 hover:text-rose-600 text-base"
                      title="Previous song"
                    >
                      ⏮️
                    </button>
                    <button
                      onClick={togglePlayPause}
                      className="p-1 hover:text-rose-600 text-base font-bold"
                      title="Play/Pause"
                    >
                      {isPlaying ? '⏸️' : '▶️'}
                    </button>
                    <button
                      onClick={() => playTrack((currentTrackIndex + 1) % PLAYLIST.length)}
                      className="p-1 hover:text-rose-600 text-base"
                      title="Next song"
                    >
                      ⏭️
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button onClick={toggleMute} className="text-sm">
                      {isMuted ? '🔇' : '🔊'}
                    </button>
                    <input
                      type="range"
                      min="0"
                      max="1"
                      step="0.05"
                      value={isMuted ? 0 : volume}
                      onChange={handleVolumeChange}
                      className="w-20 accent-rose-500 h-1 bg-rose-100 rounded-lg cursor-pointer"
                    />
                  </div>
                </div>

                {/* Playlist Tracks List */}
                <div className="mt-3 space-y-1.5 max-h-56 overflow-y-auto pr-1">
                  {PLAYLIST.map((track, idx) => {
                    const isSelected = currentTrackIndex === idx;
                    return (
                      <button
                        key={track.id}
                        onClick={() => playTrack(idx)}
                        className={`w-full flex items-center justify-between p-2.5 rounded-2xl text-left transition-all ${
                          isSelected
                            ? 'bg-rose-600 text-white shadow-md'
                            : 'hover:bg-rose-50 text-rose-900 border border-rose-100'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="text-lg">{track.icon}</span>
                          <div className="min-w-0">
                            <p className="text-xs sm:text-sm font-bold truncate">
                              {track.title}
                            </p>
                            <p className={`text-[10px] truncate ${isSelected ? 'text-rose-100' : 'text-rose-600'}`}>
                              {track.subtitle}
                            </p>
                          </div>
                        </div>

                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ml-2 ${
                          isSelected ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-700'
                        }`}>
                          {track.badge}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </aside>

          {/* =============================================================== */}
          {/* THE 4-PAGE 3D BOOK PAGER                                        */}
          {/* =============================================================== */}
          <BookPager
            pages={bookPages}
            currentPage={currentPage}
            onPageChange={setCurrentPage}
          />

          {/* =============================================================== */}
          {/* FULL-SCREEN GIFT-STYLE OPENING COVER (With Satin Ribbon & Bow)   */}
          {/* =============================================================== */}
          <OpeningCover
            isOpen={isCoverOpen}
            onOpenCover={() => setIsCoverOpen(true)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
