  <style>
    /* ========================================================= */
    /* 1. 100dvh VIEWPORT & 3D BOOK TURNING STYLES               */
    /* ========================================================= */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Global viewport lock: no page-level scrolling */
    }

    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .book-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      perspective: 2200px;
      perspective-origin: center center;
    }

    .book-page-leaf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Inner container scrolling for small screens with hidden scrollbar */
    .page-scroll-container {
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    .page-scroll-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    /* ========================================================= */
    /* 2. ATMOSPHERE & BACKGROUND MOTION GRAPHICS                */
    /* ========================================================= */
    @keyframes atmosphereGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .atmosphere-gradient {
      background: linear-gradient(
        135deg,
        #fff1f2 0%,
        #ffe4e6 20%,
        #fef3c7 45%,
        #fed7aa 70%,
        #fce7f3 90%,
        #fff1f2 100%
      );
      background-size: 260% 260%;
      animation: atmosphereGradientShift 20s ease-in-out infinite;
    }

    /* Glassmorphism Cards with Soft Glowing Border */
    .glass-glow-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 14px 34px -10px rgba(225, 29, 72, 0.12),
        0 0 0 1px rgba(254, 205, 211, 0.4),
        0 0 22px -4px rgba(251, 113, 133, 0.15);
      transition: box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s ease;
    }
    .glass-glow-card:hover {
      box-shadow: 
        0 20px 42px -8px rgba(225, 29, 72, 0.2),
        0 0 0 1px rgba(244, 63, 94, 0.55),
        0 0 30px -2px rgba(244, 63, 94, 0.25);
    }

    /* ========================================================= */
    /* 3. RIBBON IDLE SWAY, SHIMMER & NUDGE ANIMATIONS           */
    /* ========================================================= */
    @keyframes ribbonIdleSway {
      0%, 100% { transform: translateY(-50%) rotate(0deg); }
      25% { transform: translateY(-50%) rotate(-2.5deg); }
      75% { transform: translateY(-50%) rotate(2.5deg); }
    }

    @keyframes ribbonShimmerSweep {
      0% { transform: translateY(-120%); opacity: 0; }
      20% { opacity: 0.85; }
      50% { transform: translateY(220%); opacity: 0; }
      100% { transform: translateY(220%); opacity: 0; }
    }

    @keyframes ribbonNudgeLeft {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-8px); }
    }
    @keyframes ribbonNudgeRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }

    .animate-ribbon-sway { animation: ribbonIdleSway 3.4s ease-in-out infinite; }
    .animate-ribbon-shimmer { animation: ribbonShimmerSweep 4.5s ease-in-out infinite; }
    .animate-nudge-left { animation: ribbonNudgeLeft 1.8s ease-in-out infinite; }
    .animate-nudge-right { animation: ribbonNudgeRight 1.8s ease-in-out infinite; }

    /* ========================================================= */
    /* 4. ROMANTIC VINTAGE STYLES & GLOWS                        */
    /* ========================================================= */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(244, 63, 94, 0.55)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.9)); transform: scale(1.03); }
    }
    @keyframes gentleBreathing {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.015) translateY(-4px); }
    }
    @keyframes shimmerRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes skyLanternDrift {
      0% { transform: translateY(0) translateX(0) scale(0.85); opacity: 0.95; }
      50% { transform: translateY(-160px) translateX(25px) scale(1.1); opacity: 0.9; }
      100% { transform: translateY(-380px) translateX(-35px) scale(0.6); opacity: 0; }
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .animate-float-slow { animation: floatSlow 4.5s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .animate-breathe { animation: gentleBreathing 4s ease-in-out infinite; }
    .animate-spin-slow { animation: spinDisc 9s linear infinite; }
    .animate-lantern { animation: skyLanternDrift 5.5s cubic-bezier(0.2, 0.8, 0.25, 1) forwards; }

    /* Shimmering gradient border animation */
    .shimmer-conic {
      background: conic-gradient(from 0deg, #f43f5e, #fbbf24, #ec4899, #f43f5e);
      animation: shimmerRotate 4s linear infinite;
    }

    /* Soundwave Equalizer Bars */
    .equalizer-bar:nth-child(1) { animation: waveBar 1.1s ease-in-out infinite 0.1s; }
    .equalizer-bar:nth-child(2) { animation: waveBar 0.9s ease-in-out infinite 0.25s; }
    .equalizer-bar:nth-child(3) { animation: waveBar 1.3s ease-in-out infinite 0.05s; }
    .equalizer-bar:nth-child(4) { animation: waveBar 0.8s ease-in-out infinite 0.35s; }
    .equalizer-bar:nth-child(5) { animation: waveBar 1.2s ease-in-out infinite 0.2s; }

    /* Vintage Paper Stationery Card */
    .paper-card {
      background-color: #fffbf5;
      background-image: 
        radial-gradient(at 15% 15%, rgba(254, 205, 211, 0.35) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(253, 230, 138, 0.25) 0px, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(244, 63, 94, 0.07) 31px, rgba(244, 63, 94, 0.07) 32px);
      box-shadow: 0 25px 60px rgba(136, 19, 55, 0.14), inset 0 0 45px rgba(251, 113, 133, 0.08);
    }

    /* Sticker Glow Effect */
    .sticker-shadow {
      filter: drop-shadow(0 14px 25px rgba(225, 29, 72, 0.22)) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
    }
    .sticker-sunset-shadow {
      filter: drop-shadow(0 18px 35px rgba(245, 158, 11, 0.35)) drop-shadow(0 8px 16px rgba(190, 24, 93, 0.25));
    }

    /* Vinyl Record Radial Grooves */
    .vinyl-grooves {
      background: repeating-radial-gradient(
        circle,
        #1c1917 0px,
        #1c1917 4px,
        #292524 5px,
        #1c1917 6px
      );
    }

    /* Letter reveal span styles */
    .gsap-letter {
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // CONFIGURATION: MOTION GRAPHICS, GSAP & PHYSICS SETTINGS
    // Customize animation speeds, staggers, ribbon elasticity, and parallax here:
    // =========================================================================
    const MOTION_CONFIG = {
      // 3D Book & Turning Physics
      book: {
        dragThreshold: 0.40, // 40% screen width to auto-turn page
        flipDurationMs: 650,  // Milliseconds for 3D flip animation
      },

      // Satin Ribbon (Fita) Aesthetics & Elasticity
      ribbon: {
        // Right ribbon (Next page) — Rich crimson rose satin gradient
        nextGradient: 'linear-gradient(135deg, #9f1239 0%, #e11d48 30%, #fecdd3 50%, #f43f5e 70%, #881337 100%)',
        // Left ribbon (Previous page) — Deep ruby wine satin gradient
        prevGradient: 'linear-gradient(135deg, #881337 0%, #be123c 30%, #ffe4e6 50%, #e11d48 70%, #4c0519 100%)',
        knotAccent: '#fbbf24',
        shadow: 'drop-shadow(0 8px 18px rgba(159, 18, 57, 0.45))',
        elasticityFactor: 0.28, // Dynamic stretch multiplier while dragged
        idleSwayDuration: 3.4,  // Seconds for gentle idle sway
      },

      // Page Entrance Stagger Timings
      entrance: {
        letterStagger: 0.022,    // Seconds between each headline letter reveal
        letterDuration: 0.65,    // Duration of letter blur-to-sharp
        stickerDuration: 1.05,   // Sticker spring-in duration
        stickerEase: 'back.out(1.8)', // Spring ease curve
        cardStagger: 0.08,       // Stagger between cards and buttons
        cardDuration: 0.75,      // Duration of cards fade-up
      },

      // Atmosphere, Parallax & Magnetic Hover
      atmosphere: {
        parallaxStrength: 12,    // Max pixel offset for mouse/tilt parallax on stickers
        bgParallaxStrength: 5,   // Max pixel offset for background layers
        magneticStrength: 0.28,  // Button magnetic pull multiplier (0.28 = 28% of mouse distance)
        lowPowerPetals: 12,      // Petal count for mobile/low-end devices
        highPowerPetals: 26,     // Petal count for modern desktop
      },

      // Finale Page 4 Climax
      finale: {
        zoomScale: 1.045,        // Cinematic zoom scale factor on flower acceptance
        zoomDuration: 3.2,       // Seconds for cinematic zoom
      }
    };

    // Helper: Check if user prefers reduced motion
    const checkReducedMotion = () => {
      if (typeof window === 'undefined') return false;
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    };

    // Helper: Detect low-end mobile devices to optimize particles and 60fps
    const isLowEndDevice = () => {
      if (typeof navigator === 'undefined') return false;
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const cores = navigator.hardwareConcurrency || 4;
      return isMobile || cores <= 4 || (typeof window !== 'undefined' && window.innerWidth < 640);
    };

    // =========================================================================
    // 1. PLAYLIST CONFIGURATION — ALL SONGS INCLUDED (Surprise song hidden)
    // =========================================================================
    const PLAYLIST = [
      {
        id: 'surprise-song',
        title: 'A Special Song For You',
        subtitle: 'Nahid’s Surprise Pick For Pakhi 💖',
        src: 'khoka.mp3',
        badge: 'Surprise 💖',
        icon: '🎁',
        durationHint: 'Secret Choice'
      },
      {
        id: 'je-pakhi',
        title: 'Je Pakhi Ghor Bujhena',
        subtitle: 'For My Beautiful Pakhi 🕊️',
        src: 'je_pakhi_ghor_bujena.mp3',
        badge: 'Romantic',
        icon: '🕊️',
        durationHint: 'Acoustic Love'
      },
      {
        id: 'chiro-ovagi',
        title: 'Chiro Ovagi',
        subtitle: 'Deep Heartfelt Melodies 🥀',
        src: 'chiro_ovagi.mp3',
        badge: 'Emotional',
        icon: '🥀',
        durationHint: 'Soulful'
      },
      {
        id: 'forever',
        title: 'Forever',
        subtitle: 'Our Journey Together Always 💫',
        src: 'forever.mp3',
        badge: 'Forever',
        icon: '💫',
        durationHint: 'Timeless'
      }
    ];

    // Default Cherished Memories with Fixed Grammar & Genuine Banter
    const DEFAULT_MEMORIES = [
      {
        id: 'first-meeting',
        badge: 'Chapter 01',
        title: 'Our First Meeting in That Yellow Dress 💛',
        date: 'First semester, our very first class',
        description: 'The very first day I saw you in that bright yellow dress! My immediate thought was: "Who is this girl? She looks so dangerously cute, I should probably keep my distance!" …little did I know you would become my whole world.'
      },
      {
        id: 'favorite-memory',
        badge: 'Chapter 02',
        title: 'Our Favorite Dates & Sweet Walks 💖',
        date: 'End of 1st semester & anywhere we are together',
        description: 'Those quiet walks where nothing else mattered. Just listening to you talk, looking at your expressive eyes, and realizing that home is anywhere you are beside me.'
      },
      {
        id: 'funniest-moment',
        badge: 'Chapter 03',
        title: 'The Transport Incident ("Eta ki ucha hoye ache?") 😂',
        date: 'Inside the campus transport',
        description: 'I know you remember this hilarious moment! When you blurted out "Eta ki ucha hoye ache?" We burst into non-stop laughter and I was so embarrassingly red! One of our most unforgettable memories.'
      },
      {
        id: 'supported-each-other',
        badge: 'Chapter 04',
        title: 'Our Playful Teasing & Constant Support 🤝',
        date: 'Every single day of our lives',
        description: 'We banter, tease, and poke fun at each other every day, but deep down, we both know we are each other’s biggest shelter and truest best friend.'
      },
      {
        id: 'future-dream',
        badge: 'Chapter 05',
        title: 'I Want To Be With You Forever 💍',
        date: 'Our Forever Ahead',
        description: 'I never want to see tears in your eyes. I want to make you smile and laugh every single day. And remember this truth: I am the only one who will happily adore, cherish, and handle all your cute tantrums and angry moods forever!'
      }
    ];

    // =========================================================================
    // 2. ROMANTIC PARTICLE CANVAS ENGINE (With Bokeh & Mobile Optimization)
    // =========================================================================
    const RomanticParticleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Adjust particle count for low-end devices
        const count = isLowEndDevice() ? MOTION_CONFIG.atmosphere.lowPowerPetals : MOTION_CONFIG.atmosphere.highPowerPetals;

        // Falling Petals & Glow Bokeh Orbs
        const petals = Array.from({ length: count }).map(() => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 6 + Math.random() * 9,
          speedY: 0.5 + Math.random() * 1.1,
          speedX: (Math.random() - 0.5) * 0.8,
          angle: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - 0.5) * 0.025,
          color: Math.random() > 0.4 ? 'rgba(251, 113, 133, 0.42)' : 'rgba(244, 63, 94, 0.32)',
          type: Math.random() > 0.5 ? 'petal' : 'heart'
        }));

        // Interactive Sparkle Trail on pointer movement
        const sparkleTrails = [];
        const handlePointer = (e) => {
          if (checkReducedMotion()) return;
          const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
          const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : null);
          if (clientX == null || clientY == null) return;

          for (let i = 0; i < 2; i++) {
            sparkleTrails.push({
              x: clientX + (Math.random() - 0.5) * 18,
              y: clientY + (Math.random() - 0.5) * 18,
              size: 2.5 + Math.random() * 4,
              alpha: 0.9,
              vx: (Math.random() - 0.5) * 1.4,
              vy: -0.7 - Math.random() * 1.4,
              color: Math.random() > 0.5 ? '#fda4af' : '#fef08a'
            });
          }
        };

        window.addEventListener('pointermove', handlePointer, { passive: true });
        window.addEventListener('touchstart', handlePointer, { passive: true });

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // 1. Draw drifting petals
          for (let p of petals) {
            p.y += p.speedY;
            p.x += Math.sin(p.angle) * 0.8 + p.speedX;
            p.angle += p.spinSpeed;

            if (p.y > height + 20) {
              p.y = -20;
              p.x = Math.random() * width;
            }
            if (p.x > width + 20) p.x = -20;
            if (p.x < -20) p.x = width + 20;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;

            if (p.type === 'heart') {
              ctx.beginPath();
              const s = p.size * 0.65;
              ctx.moveTo(0, s / 3);
              ctx.bezierCurveTo(-s, -s / 2, -s, s, 0, s * 1.5);
              ctx.bezierCurveTo(s, s, s, -s / 2, 0, s / 3);
              ctx.fill();
            } else {
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          // 2. Draw interactive sparkle trail
          for (let i = sparkleTrails.length - 1; i >= 0; i--) {
            const sp = sparkleTrails[i];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.alpha -= 0.025;

            if (sp.alpha <= 0) {
              sparkleTrails.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = sp.alpha;
            ctx.fillStyle = sp.color;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('pointermove', handlePointer);
          window.removeEventListener('touchstart', handlePointer);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" aria-hidden="true" />;
    };

    // =========================================================================
    // 3. LETTER-BY-LETTER BLUR-TO-SHARP HEADLINE COMPONENT (GSAP 3.12.x)
    // =========================================================================
    const AnimatedHeadline = ({
      text,
      isActive = true,
      className = "",
      as: Tag = "h2"
    }) => {
      const containerRef = useRef(null);

      // Split text into words, preserving spaces & emojis safely
      const words = useMemo(() => {
        return text.split(' ').map((word) => ({
          word,
          chars: Array.from(word)
        }));
      }, [text]);

      useEffect(() => {
        if (!isActive || !containerRef.current) return;
        const letters = containerRef.current.querySelectorAll('.gsap-letter');
        if (!letters || letters.length === 0) return;

        if (checkReducedMotion()) {
          gsap.set(letters, { opacity: 1, y: 0, filter: 'blur(0px)' });
          return;
        }

        // Set initial state: shifted down with blur
        gsap.set(letters, {
          opacity: 0,
          y: 18,
          filter: 'blur(8px)',
          willChange: 'transform, opacity, filter'
        });

        // Stagger reveal letter-by-letter to sharp focus
        const anim = gsap.to(letters, {
          opacity: 1,
          y: 0,
          filter: 'blur(0px)',
          duration: MOTION_CONFIG.entrance.letterDuration,
          stagger: MOTION_CONFIG.entrance.letterStagger,
          ease: 'power3.out',
          delay: 0.12
        });

        return () => {
          anim.kill();
        };
      }, [isActive, text]);

      return (
        <Tag ref={containerRef} className={`${className} select-none`}>
          {words.map((w, wIdx) => (
            <span key={wIdx} className="inline-block whitespace-nowrap">
              {w.chars.map((char, cIdx) => (
                <span key={cIdx} className="gsap-letter">
                  {char}
                </span>
              ))}
              {wIdx < words.length - 1 && <span className="inline-block">&nbsp;</span>}
            </span>
          ))}
        </Tag>
      );
    };

    // =========================================================================
    // 4. MAGNETIC HOVER BUTTON COMPONENT (GSAP Magnetic Pull & Spring Release)
    // =========================================================================
    const MagneticButton = ({
      children,
      onClick,
      className = "",
      ariaLabel,
      strength = MOTION_CONFIG.atmosphere.magneticStrength,
      ...props
    }) => {
      const btnRef = useRef(null);

      const handleMouseMove = (e) => {
        if (checkReducedMotion() || !btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;

        gsap.to(btnRef.current, {
          x: dx * strength,
          y: dy * strength,
          duration: 0.3,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      };

      const handleMouseLeave = () => {
        if (checkReducedMotion() || !btnRef.current) return;
        gsap.to(btnRef.current, {
          x: 0,
          y: 0,
          duration: 0.7,
          ease: 'elastic.out(1.1, 0.4)',
          overwrite: 'auto'
        });
      };

      return (
        <button
          ref={btnRef}
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          aria-label={ariaLabel}
          className={`${className} will-change-transform`}
          {...props}
        >
          {children}
        </button>
      );
    };

    // =========================================================================
    // 5. REUSABLE RIBBON HANDLE COMPONENT (Fita with Sway, Shimmer & Stretch)
    // =========================================================================
    const RibbonHandle = ({
      position = 'right', // 'right' | 'left'
      onDragStart,
      onDrag,
      onDragEnd,
      onClick,
      isSmall = false,
      ariaLabel = "Turn page",
      hintText,
      isCover = false
    }) => {
      const [isHovered, setIsHovered] = useState(false);
      const [isPressing, setIsPressing] = useState(false);
      const [dragDistance, setDragDistance] = useState(0);
      const dragInfoRef = useRef({ startX: 0, startY: 0, totalDeltaX: 0, startTime: 0, isDragging: false });
      const ribbonRef = useRef(null);
      const knotRef = useRef(null);

      const handlePointerDown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;

        e.stopPropagation();
        try {
          e.currentTarget.setPointerCapture(e.pointerId);
        } catch (err) {}

        setIsPressing(true);
        const startX = e.clientX;
        const startY = e.clientY;
        dragInfoRef.current = {
          startX,
          startY,
          totalDeltaX: 0,
          startTime: Date.now(),
          isDragging: false
        };

        if (onDragStart) onDragStart(startX, startY);
      };

      const handlePointerMove = (e) => {
        if (!isPressing) return;
        e.stopPropagation();

        const currentX = e.clientX;
        const startX = dragInfoRef.current.startX;

        // Right ribbon: dragging left (startX - currentX) is positive
        // Left ribbon: dragging right (currentX - startX) is positive
        const rawDelta = position === 'right' ? (startX - currentX) : (currentX - startX);
        const deltaX = Math.max(0, rawDelta);

        if (Math.abs(currentX - startX) > 6) {
          dragInfoRef.current.isDragging = true;
        }

        dragInfoRef.current.totalDeltaX = deltaX;
        setDragDistance(deltaX);

        if (onDrag) onDrag(deltaX, currentX);
      };

      const handlePointerUp = (e) => {
        if (!isPressing) return;
        e.stopPropagation();
        setIsPressing(false);
        setDragDistance(0);

        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (err) {}

        const { isDragging, totalDeltaX, startTime } = dragInfoRef.current;
        const elapsedTime = Date.now() - startTime;

        // If it was a quick tap or minimal drag, treat as a click!
        if (!isDragging || (totalDeltaX < 8 && elapsedTime < 320)) {
          if (onClick) onClick();
          if (onDragEnd) onDragEnd(0);
        } else {
          if (onDragEnd) onDragEnd(totalDeltaX);
        }
      };

      const handlePointerCancel = (e) => {
        if (!isPressing) return;
        setIsPressing(false);
        setDragDistance(0);
        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (err) {}
        if (onDragEnd) onDragEnd(0);
      };

      const isRight = position === 'right';
      const ribbonWidth = isCover ? 'w-10 sm:w-12' : (isSmall ? 'w-6 sm:w-7' : 'w-8 sm:w-10');
      const hitboxWidth = isCover ? 'w-16 sm:w-20' : (isSmall ? 'w-12 sm:w-14' : 'w-14 sm:w-16');

      // Dynamic stretch multiplier while dragging
      const stretchScale = 1 + Math.min(0.35, (dragDistance / 450) * MOTION_CONFIG.ribbon.elasticityFactor);

      return (
        <div
          role="button"
          tabIndex={0}
          aria-label={ariaLabel}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerCancel}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{ touchAction: 'none' }}
          className={`absolute top-0 bottom-0 ${isRight ? 'right-0' : 'left-0'} ${hitboxWidth} z-30 flex items-center justify-center select-none cursor-pointer`}
        >
          {/* Satin Ribbon (Fita) Hanging Strip with Elastic Stretch */}
          <div
            ref={ribbonRef}
            className={`absolute top-0 bottom-0 ${isRight ? 'right-0 origin-right' : 'left-0 origin-left'} ${ribbonWidth} pointer-events-none overflow-hidden transition-transform duration-150`}
            style={{
              background: isRight ? MOTION_CONFIG.ribbon.nextGradient : MOTION_CONFIG.ribbon.prevGradient,
              boxShadow: isRight
                ? '-5px 0 18px rgba(136, 19, 55, 0.35), inset 2px 0 3px rgba(255, 255, 255, 0.4), inset -2px 0 3px rgba(0, 0, 0, 0.25)'
                : '5px 0 18px rgba(136, 19, 55, 0.35), inset -2px 0 3px rgba(255, 255, 255, 0.4), inset 2px 0 3px rgba(0, 0, 0, 0.25)',
              borderRight: isRight ? '1px dashed rgba(254, 205, 211, 0.5)' : 'none',
              borderLeft: !isRight ? '1px dashed rgba(254, 205, 211, 0.5)' : 'none',
              transform: `scaleX(${isPressing ? stretchScale : 1})`,
              willChange: 'transform'
            }}
          >
            {/* Shimmer Highlight Sweep */}
            <div className="absolute inset-x-0 h-28 ribbon-shimmer-sweep animate-ribbon-shimmer pointer-events-none" />
            <div className="absolute inset-0 opacity-30 bg-gradient-to-b from-white/30 via-transparent to-black/25" />
          </div>

          {/* Decorative Bow & Knot Drag Handle (With Idle Sway & Drag Spring) */}
          <div
            ref={knotRef}
            className={`absolute top-1/2 -translate-y-1/2 z-10 flex flex-col items-center justify-center ${
              !isPressing ? 'animate-ribbon-sway' : ''
            } transition-transform duration-200`}
            style={{
              filter: MOTION_CONFIG.ribbon.shadow,
              transform: isPressing
                ? `translateY(-50%) scale(${isRight ? -1 : 1} * 1.08, 0.95)`
                : (isHovered ? 'translateY(-50%) scale(1.12)' : 'translateY(-50%) scale(1)'),
              willChange: 'transform'
            }}
          >
            {/* Ornate Gold & Crimson Ribbon Knot SVG */}
            <div className="relative">
              <svg
                viewBox="0 0 100 80"
                className={`${isSmall ? 'w-8 h-7 sm:w-9 sm:h-8' : (isCover ? 'w-14 h-12 sm:w-16 sm:h-14' : 'w-11 h-9 sm:w-13 sm:h-11')} filter drop-shadow-md`}
              >
                {/* Left Bow Loop */}
                <path
                  d="M50 40 C32 15, 8 20, 14 38 C20 54, 42 46, 50 40 Z"
                  fill={isRight ? "#f43f5e" : "#fb7185"}
                  stroke="#ffe4e6"
                  strokeWidth="2"
                />
                {/* Right Bow Loop */}
                <path
                  d="M50 40 C68 15, 92 20, 86 38 C80 54, 58 46, 50 40 Z"
                  fill={isRight ? "#f43f5e" : "#fb7185"}
                  stroke="#ffe4e6"
                  strokeWidth="2"
                />
                {/* Left Ribbon Tail */}
                <path d="M46 43 C38 58, 26 72, 18 78 L32 74 L42 63 Z" fill="#be123c" />
                {/* Right Ribbon Tail */}
                <path d="M54 43 C62 58, 74 72, 82 78 L68 74 L58 63 Z" fill="#be123c" />
                {/* Center Knot (Golden Gem) */}
                <circle cx="50" cy="40" r="8" fill={MOTION_CONFIG.ribbon.knotAccent} stroke="#fef08a" strokeWidth="2" />
                <circle cx="48" cy="38" r="3" fill="#ffffff" opacity="0.8" />
              </svg>

              {/* Golden Pulse Aura on cover handle */}
              {isCover && (
                <span className="absolute -inset-1 rounded-full bg-amber-300/40 blur-sm animate-ping -z-10" />
              )}
            </div>

            {/* Optional Hint Text or Directional Arrow */}
            {hintText ? (
              <div className="absolute right-14 sm:right-16 top-1/2 -translate-y-1/2 whitespace-nowrap bg-rose-950/90 text-amber-200 border border-amber-300/50 text-xs sm:text-sm font-semibold px-3.5 py-1.5 rounded-full shadow-xl animate-nudge-left pointer-events-none flex items-center gap-1.5">
                <span>{hintText}</span>
              </div>
            ) : (
              <span className={`text-[10px] font-bold text-white drop-shadow-md mt-0.5 select-none ${isSmall ? 'text-[8px]' : ''}`}>
                {isRight ? '◀' : '▶'}
              </span>
            )}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 6. OPENING COVER COMPONENT (Full-Screen Gift-Style 3D Peeling Cover)
    // =========================================================================
    const OpeningCover = ({
      isOpen,
      onOpenCover,
      onFirstInteraction
    }) => {
      const [dragProgress, setDragProgress] = useState(0); // 0 to 1
      const [isDragging, setIsDragging] = useState(false);
      const [isSpringing, setIsSpringing] = useState(false);
      const [isComplete, setIsComplete] = useState(false);
      const coverLeafRef = useRef(null);

      if (isOpen && isComplete) return null;

      const handleDragStart = () => {
        onFirstInteraction();
        setIsDragging(true);
        setIsSpringing(false);
      };

      const handleDrag = (deltaX) => {
        const screenWidth = window.innerWidth || 1000;
        const progress = Math.min(1, Math.max(0, deltaX / screenWidth));
        setDragProgress(progress);
      };

      const handleDragEnd = (deltaX) => {
        setIsDragging(false);
        const screenWidth = window.innerWidth || 1000;
        const progress = deltaX / screenWidth;

        if (progress >= MOTION_CONFIG.book.dragThreshold) {
          completeCoverTurn();
        } else {
          setIsSpringing(true);
          setDragProgress(0);
          setTimeout(() => setIsSpringing(false), MOTION_CONFIG.book.flipDurationMs);
        }
      };

      const handleCoverRibbonClick = () => {
        onFirstInteraction();
        completeCoverTurn();
      };

      const completeCoverTurn = () => {
        setIsSpringing(true);
        setDragProgress(1);

        // Confetti & Petals Burst upon unlocking the gift
        if (window.confetti && !checkReducedMotion()) {
          window.confetti({
            particleCount: isLowEndDevice() ? 30 : 60,
            spread: 75,
            origin: { x: 0.5, y: 0.5 },
            colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ffffff']
          });
        }

        setTimeout(() => {
          setIsComplete(true);
          onOpenCover();
        }, MOTION_CONFIG.book.flipDurationMs);
      };

      // 3D Rotation angle: 0deg -> -180deg
      const currentAngle = -(dragProgress * 180);
      const shadowOpacity = Math.min(0.65, dragProgress * 0.9);

      return (
        <div
          className="fixed inset-0 z-50 overflow-hidden pointer-events-auto select-none"
          style={{ perspective: '2200px' }}
        >
          {/* 3D Turning Leaf for the Cover */}
          <div
            ref={coverLeafRef}
            className="relative w-full h-full"
            style={{
              transformOrigin: 'left center',
              transform: `rotateY(${currentAngle}deg)`,
              transformStyle: 'preserve-3d',
              transition: isDragging ? 'none' : `transform ${MOTION_CONFIG.book.flipDurationMs}ms cubic-bezier(0.25, 1, 0.5, 1)`,
              willChange: 'transform'
            }}
          >
            {/* Front Face of the Gift Cover */}
            <div
              className="absolute inset-0 w-full h-full flex flex-col items-center justify-center text-center p-6 bg-gradient-to-br from-rose-950 via-rose-900 to-amber-950 text-white overflow-hidden"
              style={{ backfaceVisibility: 'hidden' }}
            >
              {/* Subtle Gift Wrap Satin Cross Pattern & Glows */}
              <div className="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-200 via-rose-500 to-transparent" />
              
              {/* Decorative Gift Box Border */}
              <div className="absolute inset-4 sm:inset-8 border-2 border-amber-300/30 rounded-3xl pointer-events-none" />
              <div className="absolute inset-6 sm:inset-10 border border-rose-300/20 rounded-2xl pointer-events-none" />

              {/* Center Content */}
              <div className="relative z-10 max-w-md w-full flex flex-col items-center px-4">
                {/* maf.jpg Portrait with Glowing Golden-Rose Frame */}
                <div className="relative flex items-center justify-center w-36 h-36 sm:w-44 sm:h-44 rounded-full p-1.5 bg-gradient-to-tr from-amber-400 via-rose-400 to-pink-300 border-4 border-amber-200/90 shadow-2xl animate-pulse-glow mb-6 overflow-hidden">
                  <img
                    src="maf.jpg"
                    alt="Amar Shundori Pakhi — Maf"
                    className="w-full h-full object-cover rounded-full select-none pointer-events-none"
                  />
                  <span className="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-rose-600 border-2 border-white flex items-center justify-center text-sm shadow-md animate-bounce">
                    ❤️
                  </span>
                </div>

                {/* Dedication Text */}
                <p className="text-amber-200/90 text-xs sm:text-sm uppercase tracking-widest mb-2 font-semibold">
                  A Handwritten Apology From Nahid Ibn Zaman
                </p>

                <AnimatedHeadline
                  text="For My Ragi Baccha, My Shundori Pakhi ❤️"
                  isActive={!isOpen}
                  as="h1"
                  className="font-serif text-2xl sm:text-4xl font-semibold text-white mb-4 leading-tight"
                />

                <p className="font-serif italic text-rose-200 text-sm sm:text-base max-w-xs mb-8">
                  “Amar ragi baccha ta, ektu shono na… ar rag kore theko na, please. 🥺❤️”
                </p>

                {/* Magnetic Tap/Slide Hint Button */}
                <MagneticButton
                  onClick={handleCoverRibbonClick}
                  className="group inline-flex items-center gap-2 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm sm:text-base px-7 py-3 rounded-full shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95"
                >
                  <span>Slide the ribbon to open 🎀</span>
                  <span className="animate-nudge-right">👈</span>
                </MagneticButton>
              </div>

              {/* Satin Ribbon Fita with Bow Knot Drag Handle on the Right Edge */}
              <RibbonHandle
                position="right"
                onDragStart={handleDragStart}
                onDrag={handleDrag}
                onDragEnd={handleDragEnd}
                onClick={handleCoverRibbonClick}
                isCover={true}
                ariaLabel="Drag ribbon left to open the book"
                hintText="Slide the ribbon to open 🎀"
              />

              {/* Dynamic 3D Peel Shadow Overlay */}
              <div
                className="absolute inset-0 pointer-events-none transition-opacity duration-150"
                style={{
                  background: 'linear-gradient(to right, rgba(0,0,0,0.5), transparent)',
                  opacity: shadowOpacity
                }}
              />
            </div>

            {/* Backside of the Cover (Interior Parchment texture as it turns) */}
            <div
              className="absolute inset-0 w-full h-full bg-[#fcf8f2] border-r-4 border-rose-300 shadow-2xl flex items-center justify-center p-8 text-center"
              style={{
                transform: 'rotateY(180deg)',
                backfaceVisibility: 'hidden',
                boxShadow: 'inset 25px 0 50px rgba(0,0,0,0.15)'
              }}
            >
              <div className="opacity-30 flex flex-col items-center">
                <span className="text-6xl mb-3">🌹</span>
                <p className="font-script text-2xl text-rose-950">A Gift of Love from Nahid</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 7. REUSABLE BOOK PAGER COMPONENT (Page Entrance GSAP, Parallax & Light Sweep)
    // =========================================================================
    const BookPager = ({
      pages,
      currentPage,
      onPageChange,
      onFirstInteraction
    }) => {
      const totalPages = pages.length;
      const [isFlipping, setIsFlipping] = useState(false);
      const [flipDirection, setFlipDirection] = useState(null); // 'next' | 'prev'
      const [dragOffset, setDragOffset] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [dragDirection, setDragDirection] = useState(null); // 'next' | 'prev'
      const wheelCooldownRef = useRef(0);
      const touchStartRef = useRef({ x: 0, y: 0, time: 0 });

      // Trigger Confetti & Bokeh Burst on page turn
      const triggerTurnBurst = (dir = 'next') => {
        if (window.confetti && !checkReducedMotion()) {
          window.confetti({
            particleCount: isLowEndDevice() ? 14 : 26,
            spread: 60,
            startVelocity: 18,
            origin: { x: dir === 'next' ? 0.8 : 0.2, y: 0.5 },
            colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ffffff'],
            ticks: 100,
            gravity: 0.75,
            shapes: ['circle']
          });
        }
      };

      // 1. Programmatic Page Navigation with 3D Flip Animation
      const goToPage = (targetIdx) => {
        if (isFlipping || targetIdx === currentPage || targetIdx < 0 || targetIdx >= totalPages) return;

        const direction = targetIdx > currentPage ? 'next' : 'prev';
        setFlipDirection(direction);
        setIsFlipping(true);
        triggerTurnBurst(direction);

        setTimeout(() => {
          onPageChange(targetIdx);
          setIsFlipping(false);
          setFlipDirection(null);
        }, MOTION_CONFIG.book.flipDurationMs);
      };

      const goToNextPage = () => {
        if (currentPage < totalPages - 1) {
          goToPage(currentPage + 1);
        }
      };

      const goToPrevPage = () => {
        if (currentPage > 0) {
          goToPage(currentPage - 1);
        }
      };

      // 2. Keyboard Navigation (Arrow keys & Page Up/Down)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
            e.preventDefault();
            goToNextPage();
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
            e.preventDefault();
            goToPrevPage();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentPage, isFlipping]);

      // 3. Debounced Mouse Wheel Navigation (One page per gesture, respects inner scrolling)
      const handleWheel = (e) => {
        if (isFlipping || isDragging) return;

        const scrollContainer = e.target.closest('.page-scroll-container');
        if (scrollContainer) {
          const { scrollTop, scrollHeight, clientHeight } = scrollContainer;
          const isAtTop = scrollTop <= 2;
          const isAtBottom = scrollTop + clientHeight >= scrollHeight - 2;

          if (e.deltaY > 0 && !isAtBottom) return;
          if (e.deltaY < 0 && !isAtTop) return;
        }

        const now = Date.now();
        if (now - wheelCooldownRef.current < 850) return;

        if (e.deltaY > 40) {
          wheelCooldownRef.current = now;
          goToNextPage();
        } else if (e.deltaY < -40) {
          wheelCooldownRef.current = now;
          goToPrevPage();
        }
      };

      // 4. Touch Horizontal Swipe Gesture Detection
      const handleTouchStart = (e) => {
        if (e.touches.length !== 1) return;
        touchStartRef.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY,
          time: Date.now()
        };
      };

      const handleTouchEnd = (e) => {
        if (isFlipping || isDragging) return;
        const dx = e.changedTouches[0].clientX - touchStartRef.current.x;
        const dy = e.changedTouches[0].clientY - touchStartRef.current.y;
        const dt = Date.now() - touchStartRef.current.time;

        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500) {
          if (dx < 0) {
            goToNextPage();
          } else {
            goToPrevPage();
          }
        }
      };

      // 5. Ribbon Drag Handling for Next (Right Ribbon) & Prev (Left Ribbon)
      const handleRibbonDragStart = (direction) => {
        if (isFlipping) return;
        onFirstInteraction();
        setIsDragging(true);
        setDragDirection(direction);
        setDragOffset(0);
      };

      const handleRibbonDrag = (deltaX) => {
        if (!isDragging) return;
        setDragOffset(deltaX);
      };

      const handleRibbonDragEnd = (deltaX) => {
        if (!isDragging) return;
        setIsDragging(false);

        const screenWidth = window.innerWidth || 1000;
        const progress = deltaX / screenWidth;

        if (progress >= MOTION_CONFIG.book.dragThreshold) {
          triggerTurnBurst(dragDirection);
          if (dragDirection === 'next' && currentPage < totalPages - 1) {
            goToNextPage();
          } else if (dragDirection === 'prev' && currentPage > 0) {
            goToPrevPage();
          }
        }
        setDragOffset(0);
        setDragDirection(null);
      };

      const screenWidth = window.innerWidth || 1000;
      const currentDragProgress = isDragging ? Math.min(1, Math.max(0, dragOffset / screenWidth)) : 0;

      return (
        <div
          onWheel={handleWheel}
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
          className="book-container relative w-full h-[100dvh] overflow-hidden select-none"
        >
          {/* 4 Book Pages */}
          {pages.map((pageContent, idx) => {
            let transform = 'rotateY(0deg)';
            let zIndex = 5;
            let pointerEvents = 'none';
            let transition = isDragging ? 'none' : `transform ${MOTION_CONFIG.book.flipDurationMs}ms cubic-bezier(0.25, 1, 0.5, 1)`;

            if (idx < currentPage) {
              transform = 'rotateY(-180deg)';
              zIndex = 1;
            } else if (idx === currentPage) {
              zIndex = 10;
              pointerEvents = 'auto';

              if (isDragging && dragDirection === 'next') {
                const angle = -(currentDragProgress * 180);
                transform = `rotateY(${angle}deg)`;
                zIndex = 20;
              } else if (isFlipping && flipDirection === 'next') {
                transform = 'rotateY(-180deg)';
                zIndex = 20;
              }
            } else if (idx === currentPage + 1) {
              zIndex = 5;
              // Parallax depth on incoming page underneath
              const parallaxX = (isDragging && dragDirection === 'next') ? (1 - currentDragProgress) * 16 : 0;
              transform = `rotateY(0deg) translateX(${parallaxX}px)`;
            }

            // Dragging backward from left ribbon
            if (isDragging && dragDirection === 'prev' && idx === currentPage - 1) {
              const angle = -180 + (currentDragProgress * 180);
              transform = `rotateY(${angle}deg)`;
              zIndex = 25;
            } else if (isFlipping && flipDirection === 'prev' && idx === currentPage - 1) {
              transform = 'rotateY(0deg)';
              zIndex = 25;
            }

            return (
              <div
                key={idx}
                className="book-page-leaf absolute inset-0 w-full h-full"
                style={{
                  transformOrigin: 'left center',
                  transform,
                  zIndex,
                  transition,
                  transformStyle: 'preserve-3d'
                }}
              >
                {/* Front Face of the Page */}
                <div
                  className="absolute inset-0 w-full h-full atmosphere-gradient text-rose-950 overflow-hidden"
                  style={{
                    backfaceVisibility: 'hidden',
                    pointerEvents
                  }}
                >
                  {/* Soft Light Sweep Gradient across turning page */}
                  <div
                    className="absolute inset-0 pointer-events-none z-30 transition-opacity duration-300"
                    style={{
                      background: 'linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.4) 48%, rgba(254,240,138,0.45) 52%, transparent 75%)',
                      opacity: (isDragging || isFlipping) ? Math.sin((currentDragProgress || 0.5) * Math.PI) * 0.85 : 0,
                      transform: `translateX(${((currentDragProgress || 0.5) - 0.5) * 80}%)`,
                      willChange: 'transform, opacity'
                    }}
                  />

                  {/* Inner scrollable container for small screens */}
                  <div className="page-scroll-container">
                    {pageContent(idx === currentPage)}
                  </div>

                  {/* Right Ribbon (Next Page) — On pages 1, 2, 3 */}
                  {idx < totalPages - 1 && (
                    <RibbonHandle
                      position="right"
                      onDragStart={() => handleRibbonDragStart('next')}
                      onDrag={handleRibbonDrag}
                      onDragEnd={handleRibbonDragEnd}
                      onClick={goToNextPage}

    // =========================================================================
    // 8. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // 1. Cover & Page Navigation State
      const [isCoverOpen, setIsCoverOpen] = useState(false);
      const [currentPage, setCurrentPage] = useState(0); // 0 = Page 1, 1 = Page 2, 2 = Page 3, 3 = Page 4

      const [showHeartQuote, setShowHeartQuote] = useState(false);
      const [typedText, setTypedText] = useState('');
      const fullHeroQuote = "Amar ragi baccha ta, ektu shono na… ar rag kore theko na, please. 🥺❤️";
      const [petalBurst, setPetalBurst] = useState([]);

      // 3. Love Letter Envelope (Page 2)
      const [letterOpened, setLetterOpened] = useState(true);

      // 4. Emotional Choice (Page 3)
      const [emotionalChoice, setEmotionalChoice] = useState(null);

      // 5. Sunset Acceptance (Page 4)
      const [acceptedSunset, setAcceptedSunset] = useState(false);

      // 6. Memories Timeline with LocalStorage Persistence (Page 3)
      const STORAGE_KEY = 'pakhi_cherished_memories_v2';
      const [memories, setMemories] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return DEFAULT_MEMORIES;
      });
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
        } catch (e) {}
      }, [memories]);

      // 7. Complete Audio Player Engine (Fixed outside pages so music never stops)
      const audioRef = useRef(null);
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0); // 0 = Surprise Song
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.85);
      const [isMuted, setIsMuted] = useState(false);
      const [showPlaylistDrawer, setShowPlaylistDrawer] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      // 8. Sunset Sky Lanterns (Page 4)
      const [skyLanterns, setSkyLanterns] = useState([]);

      const currentTrack = PLAYLIST[currentTrackIndex];

      // Toast Notification Helper
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 4500);
      };

      // Confetti & Petals Explosion Helper
      const launchCelebration = () => {
        if (window.confetti && !checkReducedMotion()) {
          window.confetti({
            particleCount: 50,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f43f5e', '#fb7185', '#fbbf24', '#ffffff']
          });
        }
      };

      // Play Specific Track by Index
      const playTrack = (index) => {
        setCurrentTrackIndex(index);
        const targetTrack = PLAYLIST[index];
        if (audioRef.current) {
          audioRef.current.src = targetTrack.src;
          audioRef.current.currentTime = 0;
          audioRef.current.play().then(() => {
            setIsPlaying(true);
            triggerToast(`Playing: ${targetTrack.title} — ${targetTrack.subtitle} 🎶`);
          }).catch(err => {
            console.warn("Audio play prevented:", err);
            triggerToast(`Tap Play to start: ${targetTrack.title} 🎵`);
          });
        }
      };

      // Toggle Play/Pause
      const togglePlayPause = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => {
            console.warn(err);
          });
        }
      };

      // Dedicated Button Click — Plays Surprise Love Song
      const handleDedicatedSurpriseClick = () => {
        const surpriseIndex = PLAYLIST.findIndex(t => t.id === 'surprise-song');
        launchCelebration();

        if (currentTrackIndex === surpriseIndex && isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
          triggerToast("⏸️ Paused our surprise song");
          return;
        }

        playTrack(surpriseIndex);
        triggerToast("💖 Playing Nahid’s special surprise song for Pakhi!");
      };

      // Track Ended -> Auto-play Next Song
      const handleAudioEnded = () => {
        const nextIndex = (currentTrackIndex + 1) % PLAYLIST.length;
        playTrack(nextIndex);
      };

      // Audio Time Update
      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
          setDuration(audioRef.current.duration || 0);
        }
      };

      // Format Seconds to MM:SS
      const formatTime = (sec) => {
        if (isNaN(sec) || sec === 0) return '0:00';
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // Handle Scrubber Seek
      const handleSeek = (e) => {
        const newTime = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = newTime;
          setCurrentTime(newTime);
        }
      };

      // Handle Volume
      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (audioRef.current) {
          audioRef.current.volume = val;
          setIsMuted(val === 0);
        }
      };

      const toggleMute = () => {
        if (!audioRef.current) return;
        if (isMuted) {
          audioRef.current.volume = volume || 0.8;
          setIsMuted(false);
        } else {
          audioRef.current.volume = 0;
          setIsMuted(true);
        }
      };

      // First Drag/Click starts music to bypass browser autoplay restrictions
      const handleFirstInteraction = () => {
        if (audioRef.current && !isPlaying) {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => {
            console.warn("Autoplay bypass note:", err);
          });
        }
      };

      // Typewriter Quote Triggered when Bouquet is Tapped on Page 1
      const handleBouquetClick = () => {
        setBouquetBloomed(true);
        setShowHeartQuote(true);
        launchCelebration();

        // Spawn floating rose petals
        const burst = Array.from({ length: 14 }).map((_, i) => ({

        // Typewriter animation
        let idx = 0;
        setTypedText('');
        const interval = setInterval(() => {
          idx += 1;
          setTypedText(fullHeroQuote.slice(0, idx));
          if (idx >= fullHeroQuote.length) clearInterval(interval);
        }, 38);
      };

      // Update Memory on Page 3
      const handleUpdateMemory = (id, field, value) => {
        setMemories(prev => prev.map(m => (m.id === id ? { ...m, [field]: value } : m)));
      };

      // Add New Chapter on Page 3
      const handleAddChapter = () => {

        const newChapter = {

      // Launch Sunset Sky Lantern on Page 4
      const handleSendSkyLantern = () => {
        launchCelebration();
        const lanternMessages = [
          "Amar Shundori Pakhi 🕊️",

        const newLantern = {
          id: Date.now() + Math.random(),
          left: 30 + Math.random() * 40,
          text: randomMsg
        };

        triggerToast("A glowing lantern carrying your love has been sent to the sky 🌅");
      };

      // Finale Action on Page 4 (Accept Flowers)
      const handleAcceptSunset = () => {
        setAcceptedSunset(true);
        launchCelebration();

        // Cinematic Zoom effect on Garden Stage Container
        const container = document.getElementById('sunset-garden-container');
        if (container && !checkReducedMotion()) {
          gsap.fromTo(container,
            { scale: 0.98 },
            { scale: MOTION_CONFIG.finale.zoomScale, duration: MOTION_CONFIG.finale.zoomDuration, ease: 'power2.out' }
          );
        }

        // Auto release multiple romantic sky lanterns in celebratory wave
        const messages = [
          "Amar Shundori Pakhi 🕊️",
          "Always Yours, Nahid ❤️",
          "Forever & Always 💫"
        ];
        messages.forEach((msg, i) => {
          setTimeout(() => {
            const l = {
              id: Date.now() + Math.random(),
              left: 25 + i * 22,
              text: msg
            };
            setSkyLanterns(prev => [...prev.slice(-6), l]);
          }, i * 700);
        });
      };

      // =======================================================================
      // MOUSE & DEVICE TILT PARALLAX SYSTEM
      // =======================================================================
      useEffect(() => {
        if (checkReducedMotion()) return;

        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;
        let animId;

        const handlePointerMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };

        const handleOrientation = (e) => {
          if (e.gamma != null && e.beta != null) {
            mouseX = Math.min(1, Math.max(-1, e.gamma / 30));
            mouseY = Math.min(1, Math.max(-1, (e.beta - 45) / 30));
          }
        };

        window.addEventListener('pointermove', handlePointerMove, { passive: true });
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', handleOrientation, { passive: true });
        }

        const loop = () => {
          // Smooth lerp dampening
          currentX += (mouseX - currentX) * 0.08;
          currentY += (mouseY - currentY) * 0.08;

          const stickers = document.querySelectorAll('.motion-sticker');
          stickers.forEach(s => {
            s.style.transform = `translate3d(${currentX * MOTION_CONFIG.atmosphere.parallaxStrength}px, ${currentY * MOTION_CONFIG.atmosphere.parallaxStrength}px, 0)`;
          });

          const bgCards = document.querySelectorAll('.motion-card');
          bgCards.forEach(c => {
            c.style.transform = `translate3d(${-currentX * MOTION_CONFIG.atmosphere.bgParallaxStrength}px, ${-currentY * MOTION_CONFIG.atmosphere.bgParallaxStrength}px, 0)`;
          });

          animId = requestAnimationFrame(loop);
        };

        loop();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('deviceorientation', handleOrientation);
        };
      }, []);

      // =======================================================================

              <div className="relative z-10 mt-2 inline-block bg-white/85 backdrop-blur-md px-3.5 py-1 rounded-full border border-rose-200 text-[11px] sm:text-xs font-semibold text-rose-800 shadow-sm">

                      <MagneticButton
                        onClick={handleDedicatedSurpriseClick}
                        className="group relative inline-flex items-center gap-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm sm:text-base px-6 sm:px-8 py-3 rounded-full shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95"
                        ariaLabel="Tap to play surprise love song"
                      >
                        <span className="text-xl transition-transform group-hover:scale-125">
                          {isPlaying && currentTrack.id === 'surprise-song' ? '⏸️' : '▶️'}
                        </span>
                        <span className="font-serif tracking-wide text-base sm:text-lg">
                          {isPlaying && currentTrack.id === 'surprise-song'
                            ? 'Pause Surprise Song 🎶'
                            : 'Tap To Play Our Surprise Song 💖'}
                        </span>
                      </MagneticButton>
                    </div>

                    {isPlaying && currentTrack.id === 'surprise-song' && (
                      <div className="mt-4 pt-3 border-t border-rose-300/20 flex flex-col items-center gap-1.5 animate-fadeIn">
                        <div className="flex items-end gap-1 h-5">
                          <span className="w-1 bg-rose-400 rounded-full equalizer-bar" />
                          <span className="w-1 bg-pink-400 rounded-full equalizer-bar" />
                          <span className="w-1 bg-amber-300 rounded-full equalizer-bar" />
                          <span className="w-1 bg-rose-300 rounded-full equalizer-bar" />
                          <span className="w-1 bg-rose-500 rounded-full equalizer-bar" />
                        </div>
                        <p className="text-xs font-semibold text-amber-200 animate-pulse">
                          Now Playing: A Special Surprise Song For My Shundori Pakhi ❤️
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Read Again 🔁 Action Button with Magnetic Hover */}
              <div className="mt-6 flex justify-center">
                <MagneticButton
                  onClick={() => {
                    setCurrentPage(0);
                    launchCelebration();
                  }}
                  className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white border border-rose-300/40 font-bold text-xs sm:text-sm px-6 py-2 rounded-full shadow-md active:scale-95 transition-all"
                >
                  <span>Read again 🔁</span>
                </MagneticButton>
              </div>

              <p className="text-[11px] sm:text-xs text-rose-200/80 mt-6">
                Handcrafted with love by Nahid Ibn Zaman for Mahmuda Khanum (Shundori Pakhi) ❤️
              </p>
            </div>
          </div>
        );
      };

      const bookPages = [renderPageOne, renderPageTwo, renderPageThree, renderPageFour];

      return (
        <div className="relative w-full h-[100dvh] overflow-hidden atmosphere-gradient text-rose-950">
          {/* Background Romantic Petals & Interactive Glow Canvas */}
          <RomanticParticleCanvas />

          {/* Hidden Core Audio Element (Kept outside pages so music never stops across page turns) */}
          <audio
            ref={audioRef}
            src={currentTrack.src}
            preload="auto"
            onTimeUpdate={handleTimeUpdate}
            onEnded={handleAudioEnded}
          />

          {/* Floating Live Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-rose-900/95 text-white px-5 py-2.5 rounded-full shadow-2xl border border-rose-300/50 text-xs sm:text-sm font-semibold flex items-center gap-2 animate-bounce">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* =============================================================== */}
          {/* FLOATING MUSIC BAR & EQUALIZER CONSOLE (Top-Right Glassmorphism) */}
          {/* =============================================================== */}
          <aside aria-label="Music player controls" className="fixed top-3 right-3 sm:top-5 sm:right-5 z-40 flex flex-col items-end">
            <div className="flex items-center gap-2 bg-white/90 backdrop-blur-md border border-rose-200/90 shadow-xl rounded-full px-3.5 py-2">
              {/* Spinning Vinyl Disc Motion Graphic */}
              <button
                onClick={() => setShowPlaylistDrawer(!showPlaylistDrawer)}
                className="relative w-8 h-8 rounded-full vinyl-grooves border border-amber-300/60 shadow-md flex items-center justify-center cursor-pointer group"
                title="Open romantic playlist"
              >
                <div className={`w-3.5 h-3.5 rounded-full bg-rose-600 border border-white flex items-center justify-center text-[7px] text-white font-bold ${isPlaying ? 'animate-spin-slow' : ''}`}>
                  ❤️
                </div>
              </button>

              {/* Play / Pause Toggle Button */}
              <button
                onClick={togglePlayPause}
                className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-rose-900 hover:text-rose-600 transition-colors"
                aria-label={isPlaying ? "Pause music" : "Play music"}
              >
                <span>{isPlaying ? '⏸️' : '▶️'}</span>
                <span className="max-w-[110px] sm:max-w-[140px] truncate text-left">
                  {isPlaying ? currentTrack.title : 'Play Music'}
                </span>
              </button>

              {/* Animated Equalizer Soundwave Bars when Playing */}
              {isPlaying && (
                <div className="flex items-end gap-0.5 h-5 px-1">
                  <span className="w-1 bg-rose-500 rounded-full equalizer-bar" />
                  <span className="w-1 bg-pink-500 rounded-full equalizer-bar" />
                  <span className="w-1 bg-amber-400 rounded-full equalizer-bar" />
                  <span className="w-1 bg-rose-600 rounded-full equalizer-bar" />
                  <span className="w-1 bg-rose-400 rounded-full equalizer-bar" />
                </div>
              )}

              {/* Playlist Toggle */}
              <button
                onClick={() => setShowPlaylistDrawer(!showPlaylistDrawer)}
                className="ml-1 pl-2 border-l border-rose-200 text-xs font-semibold text-rose-700 hover:text-rose-950 flex items-center gap-1"
                aria-label="Open playlist drawer"
              >
                <span>🎶</span>
                <span className="hidden sm:inline">Songs ({PLAYLIST.length})</span>
              </button>
            </div>

            {/* Expandable Glassmorphic Playlist & Scrubber Drawer */}
            {showPlaylistDrawer && (
              <div className="mt-2 w-80 sm:w-96 bg-white/95 backdrop-blur-xl border border-rose-200 rounded-3xl p-4 sm:p-5 shadow-2xl animate-fadeIn text-rose-950">
                <div className="flex items-center justify-between pb-3 border-b border-rose-100">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📻</span>
                    <div>
                      <h4 className="font-serif font-bold text-base text-rose-950 leading-tight">
                        Our Romantic Jukebox
                      </h4>
                      <p className="text-[11px] text-rose-600 font-medium">All Songs From The Folder</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowPlaylistDrawer(false)}
                    className="text-xs text-rose-400 hover:text-rose-800 font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                {/* Scrubber Bar */}
                <div className="py-3">
                  <div className="flex justify-between text-[11px] font-semibold text-rose-700 mb-1">
                    <span>{formatTime(currentTime)}</span>
                    <span className="text-rose-900 font-bold">{currentTrack.title}</span>
                    <span>{formatTime(duration)}</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max={duration || 100}
                    value={currentTime}
                    onChange={handleSeek}
                    className="w-full accent-rose-600 h-1.5 bg-rose-100 rounded-lg cursor-pointer"
                  />
                </div>

                {/* Volume & Controls Row */}
                <div className="flex items-center justify-between py-2 border-b border-rose-100 text-xs">
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => playTrack((currentTrackIndex - 1 + PLAYLIST.length) % PLAYLIST.length)}
                      className="p-1 hover:text-rose-600 text-base"
                      title="Previous song"
                    >
                      ⏮️
                    </button>
                    <button
                      onClick={togglePlayPause}
                      className="p-1 hover:text-rose-600 text-base font-bold"
                      title="Play/Pause"
                    >
                      {isPlaying ? '⏸️' : '▶️'}
                    </button>
                    <button
                      onClick={() => playTrack((currentTrackIndex + 1) % PLAYLIST.length)}
                      className="p-1 hover:text-rose-600 text-base"
                      title="Next song"
                    >
                      ⏭️
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button onClick={toggleMute} className="text-sm">
                      {isMuted ? '🔇' : '🔊'}
                    </button>
                    <input
                      type="range"
                      min="0"
                      max="1"
                      step="0.05"
                      value={isMuted ? 0 : volume}
                      onChange={handleVolumeChange}
                      className="w-20 accent-rose-500 h-1 bg-rose-100 rounded-lg cursor-pointer"
                    />
                  </div>
                </div>

                {/* Playlist Tracks List */}
                <div className="mt-3 space-y-1.5 max-h-56 overflow-y-auto pr-1">
                  {PLAYLIST.map((track, idx) => {
                    const isSelected = currentTrackIndex === idx;
                    return (
                      <button
                        key={track.id}
                        onClick={() => playTrack(idx)}
                        className={`w-full flex items-center justify-between p-2.5 rounded-2xl text-left transition-all ${
                          isSelected
                            ? 'bg-rose-600 text-white shadow-md'
                            : 'hover:bg-rose-50 text-rose-900 border border-rose-100'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="text-lg">{track.icon}</span>
                          <div className="min-w-0">
                            <p className="text-xs sm:text-sm font-bold truncate">
                              {track.title}
                            </p>
                            <p className={`text-[10px] truncate ${isSelected ? 'text-rose-100' : 'text-rose-600'}`}>
                              {track.subtitle}
                            </p>
                          </div>
                        </div>

                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ml-2 ${
                          isSelected ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-700'
                        }`}>
                          {track.badge}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </aside>

          {/* =============================================================== */}
          {/* THE 4-PAGE 3D BOOK PAGER                                        */}
          {/* =============================================================== */}
          <BookPager
            pages={bookPages}
            currentPage={currentPage}
            onPageChange={setCurrentPage}
            onFirstInteraction={handleFirstInteraction}
          />

          {/* =============================================================== */}
          {/* FULL-SCREEN GIFT-STYLE OPENING COVER (With Satin Ribbon & Bow)   */}
          {/* =============================================================== */}
          <OpeningCover
            isOpen={isCoverOpen}
            onOpenCover={() => setIsCoverOpen(true)}
            onFirstInteraction={handleFirstInteraction}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
